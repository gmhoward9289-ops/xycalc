# Tunnel-only, following the house pattern on swamplink: every container there
# publishes to 127.0.0.1 and nothing else, and UFW allows only 22/80/443. The
# calculator is a tool, not a public site, so it gets no Caddy vhost and no
# certificate — reach it over SSH from a machine you trust:
#
#     ssh -N -L 8105:127.0.0.1:8105 swamplink
#     open http://127.0.0.1:8105
#
# NOTE: this compose file references `build: .` but there is no Dockerfile at
# the repo root (the swamplink server image is maintained out-of-band). For
# local dev use `pip install -e ".[dev,gui]"` and `xycalc gui` instead.
# Do not run `docker compose up` here unless you add a root Dockerfile or
# point `build` at an existing one under tools/bench/.
#
# The same shape as the Ollama forward on COOPER, and for the same reason:
# binding a service to the wildcard to "fix" connectivity is how an internal
# tool becomes an internet-facing one.
#
# Ports in use on swamplink: 8100 api-demo, 8101 wings, 8102 wings-preview,
# and Caddy holds 8103 and 8104 for its tunnel-only vhosts. xycalc takes 8105.
#
# Explicit project name, not the directory name. Compose defaults to the
# containing directory, every app on swamplink is checked out at
# /srv/apps/<app>/src, and so every one of them defaults to the project "src".
# That is not cosmetic: two projects sharing a name share orphan detection and
# `down`, so a teardown in one app's directory can reach into another's. There
# is already a stray `src-wings-1` container on the box from exactly this.
name: xycalc

services:
  xycalc:
    build: .
    image: xycalc:local
    container_name: xycalc
    restart: unless-stopped
    ports:
      - "127.0.0.1:8105:8000"
    # No volumes. The corpus is in the image and the app writes nothing; a
    # bind mount here would only create a way for the served answers to
    # disagree with the committed YAML.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
