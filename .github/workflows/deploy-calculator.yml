name: Deploy calculator

# swamplink.com/tools/xycalc/calculator/ is a static page baked by
# `xycalc export`, published from a SEPARATE repo (swamplink-root) that also
# holds every other page on the site. There's no webhook between the two --
# publishing means writing the exported file into that repo and pushing it to
# swamplink-root's own bare repo on lynx, whose post-receive hook then
# unpacks the tree straight into /var/www/swamplink. Pushing IS deploying.
#
# The deploy key is scoped to exactly this: a forced command on lynx
# (/usr/local/bin/xycalc-push-only) permits only git-upload-pack and
# git-receive-pack against swamplink-root.git, nothing else. Read access is
# needed -- unlike a single-repo deploy that can force-push its own full
# tree, this job edits one file inside a repo it doesn't otherwise own, so it
# has to clone, splice in the export, and push a normal commit.
#
# A push to main used to start this workflow in parallel with ci.yml, so a
# red SHA could go live. GitHub `needs:` only names jobs in the SAME
# workflow, and wiring deploy into ci.yml as a reusable workflow fails
# closed the other way: ci.yml's GITHUB_TOKEN is contents:read (a
# Dependabot-compromised pip install must not inherit write), which cannot
# grant the called workflow checks:read.
#
# workflow_run is the other cross-workflow trigger GitHub supports, but it
# is the wrong shape here: it fires only after the entire `ci` workflow
# finishes (including test-py311 / test-py313, which are not merge gates),
# and GITHUB_SHA on the follow-up run is the default-branch tip, not the
# commit that was evaluated. Combined commit status is also too wide
# (codespell and the extra Python jobs).
#
# So this workflow still starts on push to main (and workflow_dispatch),
# then the merge-gates job polls the Checks API for the main-protection
# ruleset required_status_checks on this SHA — audit, build, test,
# test-py314, not invented names — and the production job does not run
# until those four are green. A red SHA fails merge-gates and never
# touches the production environment.
#
# A GITHUB_TOKEN auto-merge does not emit `push` at all, so this file's
# `on.push` never runs for those SHAs. auto-merge.yml waits for the merge
# and workflow_dispatches this workflow (and ci.yml); kick-main-pipelines.yml
# is the CodeQL-on-main backstop. Merge-gates still apply to those runs.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-calculator
  cancel-in-progress: false

# The deploy credentials live on the `production` environment, not on the
# repo, so a workflow change on a non-protected branch can't read them.
# checks/actions read is for the merge-gates poll only.
permissions:
  contents: read
  actions: read
  checks: read

jobs:
  merge-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Wait for merge-gate checks on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wait-merge-gates.sh

  deploy:
    needs: [merge-gates]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the corpus and export the calculator
        run: |
          pip install -e .
          xycalc export --out /tmp/calculator.html \
            --crumb '<div class="crumb"><a href="/">swamplink.com</a> / <a href="/tools/">tools</a> / <a href="/tools/xycalc/">xycalc</a> / calculator</div>'

      - name: Fail if Python/JS golden vectors disagree in the export
        run: node .github/scripts/check-export-goldens.js /tmp/calculator.html

      - name: Splice the export into swamplink-root and push
        env:
          SSH_KEY: ${{ secrets.SWAMPLINK_SSH_KEY }}
          HOST: ${{ secrets.SWAMPLINK_HOST }}
          KNOWN_HOSTS: ${{ secrets.SWAMPLINK_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$HOST" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::SWAMPLINK_SSH_KEY, SWAMPLINK_HOST and SWAMPLINK_KNOWN_HOSTS must be set."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/deploy -o BatchMode=yes'

          git clone "${HOST}:/srv/git/swamplink-root.git" /tmp/swamplink-root
          cd /tmp/swamplink-root

          if [ ! -f tools/xycalc/calculator/index.html ]; then
            echo "::error::tools/xycalc/calculator/index.html not found in swamplink-root -- refusing to guess where the export goes"
            exit 1
          fi
          cp /tmp/calculator.html tools/xycalc/calculator/index.html

          git config user.name "xycalc deploy"
          git config user.email "dev@swamplink.com"

          if git diff --quiet -- tools/xycalc/calculator/index.html; then
            echo "export unchanged, nothing to deploy"
            exit 0
          fi

          git add tools/xycalc/calculator/index.html
          git commit -m "chore(xycalc): re-export calculator @ ${GITHUB_SHA}"
          git push origin master

      - name: Verify the live page is this export and goldens still agree
        run: |
          for i in $(seq 1 12); do
            code="$(curl -s -o /tmp/page.html -w '%{http_code}' https://swamplink.com/tools/xycalc/calculator/)"
            if [ "$code" = "200" ] && grep -qi '<title>xycalc' /tmp/page.html; then
              if node .github/scripts/check-export-goldens.js /tmp/page.html /tmp/calculator.html; then
                echo "anonymous GET is 200, title matches, goldens agree, corpus_digest matches the export"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::https://swamplink.com/tools/xycalc/calculator/ did not serve this SHA's export with agreeing goldens"
          head -c 500 /tmp/page.html || true
          exit 1
