# Three jobs, not one. "Is every number sourced?" is the project's central
# claim, so it gets its own check with its own red X rather than a line buried
# in a test log. A corpus whose citation guarantee fails silently inside a test
# summary has a guarantee nobody can see.

name: ci

on:
  push:
  pull_request:
  # GITHUB_TOKEN auto-merge swallows `push` on main. auto-merge.yml and
  # kick-main-pipelines.yml start this workflow via workflow_dispatch.
  workflow_dispatch:

# CodeQL alerts #8, #9, #11 and #12 (actions/missing-workflow-permissions).
# Without this, GITHUB_TOKEN is granted whatever the repository default is,
# which can include write access to contents, packages, issues and pull
# requests. These three jobs check out a public repo and run pytest; read is
# all any of them needs, and scoping it here covers every job at once rather
# than four times over.
#
# It matters more than it looks on a repo that runs Dependabot: a compromised
# or malicious dependency executing during `pip install -e` inherits this
# token, and the difference between read and write is the difference between
# a bad afternoon and a rewritten history.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,gui]"
      - run: python -m xycalc.build

  # Required check name is exactly `test` (branch ruleset). Do not turn this
  # into a matrix -- GitHub renames matrix legs to `test (3.12)` etc. and the
  # required check never reports. Wider coverage lives in additive jobs below.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,gui]"
      - run: pytest -q

  test-py311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,gui]"
      - run: pytest -q

  test-py313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,gui]"
      - run: pytest -q

  # Deliberately a SEPARATE job rather than a matrix on `test`. The branch
  # ruleset requires status checks by exact name -- `audit`, `build`, `test` --
  # and a matrix renames them to `test (3.12)` / `test (3.14)`, so the required
  # check `test` would never report again and every pull request would block
  # forever. Additive is the only safe shape here.
  #
  # The job ID is `test-py314`, not `test-3.14`: GitHub Actions job IDs allow
  # letters, digits, `-` and `_` only. A dot makes the whole workflow file
  # invalid, and the run fails in 0 seconds with no jobs and no readable error
  # -- which looks exactly like CI silently not running.
  #
  # Exists because Dependabot once bumped a now-removed Dockerfile to
  # python:3.14-slim (#24) while CI tested only 3.12: what shipped was not
  # what was tested. Kept as an explicit 3.14 check now that nothing else
  # exercises that version.
  test-py314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,gui]"
      - run: pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,gui]"
      - run: python -m xycalc.audit
