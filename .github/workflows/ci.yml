# Three jobs, not one. "Is every number sourced?" is the project's central
# claim, so it gets its own check with its own red X rather than a line buried
# in a test log. A corpus whose citation guarantee fails silently inside a test
# summary has a guarantee nobody can see.

name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev,gui]"
      - run: python -m xycalc.build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev,gui]"
      - run: pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev,gui]"
      - run: python -m xycalc.audit
