# What this corpus can size.
#
# Most of these are stubs on purpose. The shape of the schema is proven on one
# system answered end to end, not on six answered shallowly — a stub costs
# nothing and a half-researched coefficient costs credibility.

systems:
  - slug: mongodb
    label: MongoDB (WiredTiger)
    category: database
    notes: >-
      The first subject, chosen because its sizing question has a well
      documented answer that contradicts how the question is usually asked.
      Cache/eviction/tickets models land first; 2026-08-20 enrichment adds
      GridFS chunk defaults, BSON 16 MiB / ObjectId 12 B floors, PyMongo pool
      defaults, and the 8.2+ cacheSizePct 80% vertical-growth ceiling — no
      GridFS or $lookup latency model yet (vendor publishes defaults and
      guidance, not join cost curves).

  - slug: nvd
    label: NVD / CVE publication
    category: data
    notes: >-
      Industry vulnerability disclosure counts. Used to project record growth
      before MongoDB instance sizing — bytes/record still comes from your
      measured database.

  - slug: ebs
    label: Amazon EBS
    category: storage
    notes: >-
      Stub. The question waiting here is microbursting: whether a volume is
      saturating at sub-second timescales that CloudWatch's one-minute
      averages structurally cannot show. See docs/telemetry/ebs.md — the
      metric we need does not exist in the obvious place, which is the finding
      rather than an obstacle to it.

  - slug: azure-disks
    label: Azure managed disks (Premium SSD v2)
    category: storage
    notes: >-
      Azure's block-storage answer to EBS gp3: Premium SSD v2 decouples
      capacity from performance, ships a free baseline (3,000 IOPS / 125 MB/s)
      and lets IOPS and throughput be provisioned independently. The
      non-obvious trap this corpus records is the throughput-to-IOPS coupling —
      you cannot buy MB/s directly past the baseline; each provisioned IOPS
      unlocks 0.25 MB/s, so a throughput target is really an IOPS floor. Figures
      are documented from the vendor and unvalidated against a running disk;
      Azure quotes throughput in decimal MB/s (10^6 B/s), deliberately a
      different parameter here from EBS's binary MiB/s.

  - slug: clickhouse
    label: ClickHouse
    category: database
    notes: Stub. No coefficients yet.

  - slug: redis
    label: Redis
    category: cache
    notes: >-
      Broker defaults, Celery transport visibility timeout, MEMORY USAGE empty
      key overhead (56 B), eviction/listpack defaults, and FAQ 20% host
      headroom (documented). Investigation 005 (T7): maxmemory policy conflict
      in corpus; measured loss/stall rates import from evict_probe via
      tools/import_evict_probe.py.

  - slug: celery
    label: Celery
    category: queue
    notes: >-
      Documented prefetch and ack defaults (Celery 5.4.0). Investigation 004
      queue amplification and investigation 005 broker maxmemory both use
      tools/bench/celery_probe/; benchmark rows import from probe JSON.

  - slug: nvme-ssd
    label: NVMe SSD (direct-attached)
    category: hardware
    notes: >-
      Local baseline for the EBS comparison. Coefficients ship as planning
      bands until io_crossover_probe measured plateaus replace them on confirmed
      local hardware.

  - slug: aws-ec2
    label: AWS EC2 (memory-optimized instance types)
    category: hardware
    notes: >-
      Core product surface: given a RAM (and related) requirement band, name
      the smallest instance that covers each of lo/mode/hi — a catalog lookup,
      not a floor/amplifier chain. See instance_select() in model.py and the
      `instance-select` CLI / mongodb.size-to-instance scenario. `--family`
      filters by name prefix (currently r8i populated). Azure VM and bare-metal
      catalogs are required peers (same pick-per-band-end contract); they are
      not optional extras — see docs/telemetry/recommendations.md Product core.

      r8i tops out at r8i.96xlarge (3,072 GiB) — the whole catalog's current
      technical ceiling. Org policy may cap recommendations lower
      (DEFAULT_INSTANCE_CEILING); above that → custom sizing / next family,
      not a guessed SKU. U7i figures researched for >3TB were deliberately
      left OUT of aws-ec2.yaml pending a family decision. See the comment
      block at the end of data/coefficients/aws-ec2.yaml.

  - slug: azure-vm
    label: Azure VMs (memory-optimized)
    category: hardware
    notes: >-
      Stub. Required peer of aws-ec2 for the core instance-sizing product:
      same pick-per-band-end contract (lo/mode/hi named SKUs + RAM/vCPU/disk
      caps), not a different math. Premium SSD v2 lives under azure-disks;
      this system is the VM SKU catalog. See docs/telemetry/recommendations.md
      Product core (U17).

  - slug: bare-metal
    label: Bare metal / colo host classes
    category: hardware
    notes: >-
      Stub. Required peer of aws-ec2 for off-cloud buys: documented host
      classes (colo, Hetzner, on-prem) with RAM/CPU/disk/network ranges and
      the same per-band-end pick. Observations may already name a machine_class;
      this system is the catalog those picks resolve against. See
      docs/telemetry/recommendations.md Product core (U17).
