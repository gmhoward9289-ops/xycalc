# What this corpus can size.
#
# Most of these are stubs on purpose. The shape of the schema is proven on one
# system answered end to end, not on six answered shallowly — a stub costs
# nothing and a half-researched coefficient costs credibility.

systems:
  - slug: mongodb
    label: MongoDB (WiredTiger)
    category: database
    notes: >-
      The first subject, chosen because its sizing question has a well
      documented answer that contradicts how the question is usually asked.
      Cache/eviction/tickets models land first; 2026-08-20 enrichment adds
      GridFS chunk defaults, BSON 16 MiB / ObjectId 12 B floors, PyMongo pool
      defaults, and the 8.2+ cacheSizePct 80% vertical-growth ceiling — no
      GridFS or $lookup latency model yet (vendor publishes defaults and
      guidance, not join cost curves).

  - slug: nvd
    label: NVD / CVE publication
    category: data
    notes: >-
      Industry vulnerability disclosure counts. Used to project record growth
      before MongoDB instance sizing — bytes/record still comes from your
      measured database.

  - slug: ebs
    label: Amazon EBS
    category: storage
    notes: >-
      Stub. The question waiting here is microbursting: whether a volume is
      saturating at sub-second timescales that CloudWatch's one-minute
      averages structurally cannot show. See docs/telemetry/ebs.md — the
      metric we need does not exist in the obvious place, which is the finding
      rather than an obstacle to it.

  - slug: clickhouse
    label: ClickHouse
    category: database
    notes: Stub. No coefficients yet.

  - slug: redis
    label: Redis
    category: cache
    notes: >-
      Broker defaults, Celery transport visibility timeout, MEMORY USAGE empty
      key overhead (56 B), eviction/listpack defaults, and FAQ 20% host
      headroom (documented). Investigation 005 (T7): maxmemory policy conflict
      in corpus; measured loss/stall rates import from evict_probe via
      tools/import_evict_probe.py.

  - slug: celery
    label: Celery
    category: queue
    notes: >-
      Documented prefetch and ack defaults (Celery 5.4.0). Investigation 004
      queue amplification and investigation 005 broker maxmemory both use
      tools/bench/celery_probe/; benchmark rows import from probe JSON.

  - slug: nvme-ssd
    label: NVMe SSD (direct-attached)
    category: hardware
    notes: >-
      Local baseline for the EBS comparison. Coefficients ship as planning
      bands until io_crossover_probe measured plateaus replace them on confirmed
      local hardware.

  - slug: aws-ec2
    label: AWS EC2 (memory-optimized instance types)
    category: hardware
    notes: >-
      Not a sizing model in the usual sense — there is no arithmetic here, only
      a catalog. The question this system answers is "given a RAM requirement,
      which named instance is the smallest one that covers it," which is a
      lookup against instance specs, not a floor/amplifier chain. See
      instance_select() in model.py and the `instance-select` CLI command,
      which takes any model's own lo/mode/hi band and reasons against this
      catalog per band-end rather than collapsing it to one point first —
      the same reason mongodb.host-ram refuses to auto-chain from
      mongodb.wt-cache. `--family` filters by name prefix and accepts
      anything actually populated below (currently r8i only) — r8g, r6g,
      etc. work the same way as soon as coefficient rows exist for them.

      r8i tops out at r8i.96xlarge (3,072 GiB) — the whole catalog's current
      ceiling. A requirement above that reports as "custom sizing" rather
      than guessing at a family (U7i, legacy u-series, or otherwise);
      several U7i figures researched for this were sourced but deliberately
      left OUT of aws-ec2.yaml pending an actual decision on which >3TB
      family gets used, so instance-select doesn't recommend something
      nobody has chosen. See the comment block at the end of
      data/coefficients/aws-ec2.yaml for how to fill it in once that's
      decided.
