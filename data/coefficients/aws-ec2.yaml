  # -- U7i family: the cited next step past r8i.96xlarge (3,072 GiB).
  #
  # Only sizes named with RAM and vCPU in sources.yaml (same 2026-08-16
  # research pass as the r8i rows, same practitioner grade) are catalogued.
  # Smaller U7i SKUs (6 TB / 8 TB) circulate in aggregators; they are not
  # in this file because this corpus does not have a checkable quote for
  # them yet. select_instance() names the smallest *cited* size that covers
  # the band — for the homepage 500 GB host-RAM high end that is
  # u7i-12tb.224xlarge, not a guessed 8 TB box.
  - slug: aws.u7i-12tb.224xlarge.ram-bytes
