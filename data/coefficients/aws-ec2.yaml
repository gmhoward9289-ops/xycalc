  # r8i.96xlarge (3,072 GiB) is the current ceiling of what this catalog can
  # recommend. A requirement above that reports as "custom sizing" rather
  # than naming a U7i instance -- see select_instance()'s `exceeds_pool`
  # branch. Recommending a specific U7i size here would be presenting a
  # guess as this corpus's answer, which is exactly what the rest of it
  # refuses to do. Fill this back in, sourced the same way as the r8i rows
  # above, once the actual instance family for >3TB deployments is decided.
  # aws-ec2-instance-types-u7i stays registered in sources.yaml for when
  # that happens.
