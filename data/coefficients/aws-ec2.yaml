# AWS EC2 memory-optimized instance catalog (r8i, U7i).
#
# Not a sizing chain like mongodb.yaml — each entry here is a spec, not an
# uncertain estimate, so lo == mode == hi. What ties them together is that
# they all resolve `instance-select`'s catalog lookup: given a RAM
# requirement, which named instance is the smallest one that covers it.
#
# Confidence is `practitioner`, not `documented`, across the board — these
# were read via an Anthropic deep-research pass (WebSearch + WebFetch across
# many agents), not fetched and archived by a human in this session the way
# the rest of this corpus's `documented` rows were. The figures are AWS's own
# published specs and were cross-checked against multiple independent
# aggregators during research, but this corpus's own rule is that a human
# promotes `documented` after confirming the live source — do that before
# leaning hard on these for a real purchase, especially since AWS instance
# catalogs change without much notice.

coefficients:
  # -- r8i family: 8 GiB RAM per vCPU, confirmed across every published size
  - slug: aws.r8i.large.ram-bytes
    parameter: host.ram_bytes
    system: aws-ec2
    applies_to: r8i.large, AWS EC2, 2026
    value: 17179869184  # 16 GiB
