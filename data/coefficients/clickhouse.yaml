# ClickHouse coefficients.
#
# Investigation 012 / ROADMAP T10 / issue #18. First figures for this system:
# the MergeTree insert-backpressure thresholds that jumped ~10× at 23.6.
# Measured insert-frequency crossover (clickhouse.insert-batch-floor) lands
# only after tools/bench/clickhouse_probe.sh produces a JSON run — that row
# must be graded benchmark with applies_to naming the container CPU/memory.

coefficients:
  - slug: clickhouse.parts-to-delay-insert-pre-23.6
    parameter: clickhouse.active_parts_delay_threshold
    system: clickhouse
    applies_to: ClickHouse <23.6 (parts_to_delay_insert default; verified v23.5.1)
    value: 150
    confidence: code
    source: clickhouse-mergetree-settings-v23.5
    quote: >-
      M(UInt64, parts_to_delay_insert, 150, "If table contains at least that
      many active parts in single partition, artificially slow down insert into
      table. Disabled if set to 0", 0)
    notes: >-
      Low side of the 23.6 threshold jump. Probe harness must confirm the live
      container reports this value before claiming a pre-23.6 run.

  - slug: clickhouse.parts-to-delay-insert-23.6-plus
    parameter: clickhouse.active_parts_delay_threshold
    system: clickhouse
    applies_to: ClickHouse >=23.6 (parts_to_delay_insert default; verified v23.6.1 and v24.3.1-lts)
    value: 1000
    confidence: code
    source: clickhouse-mergetree-settings-v23.6
    quote: >-
      M(UInt64, parts_to_delay_insert, 1000, "If table contains at least that
      many active parts in single partition, artificially slow down insert into
      table. Disabled if set to 0", 0)
    notes: >-
      High side of the tenfold change. Same default still present in
      v24.3.1-lts MergeTreeSettings.h on 2026-08-21 retrieval.

  - slug: clickhouse.parts-to-throw-insert-pre-23.6
    parameter: clickhouse.active_parts_throw_threshold
    system: clickhouse
    applies_to: ClickHouse <23.6 (parts_to_throw_insert default; verified v23.5.1)
    value: 300
    confidence: code
    source: clickhouse-mergetree-settings-v23.5
    quote: >-
      M(UInt64, parts_to_throw_insert, 300, "If more than this number active
      parts in single partition, throw 'Too many parts ...' exception.", 0)
    notes: >-
      Pre-23.6 reject ceiling. Crossing it raises the classic Too many parts
      DB::Exception — credit reject only from that exception text, not from
      latency alone.

  - slug: clickhouse.parts-to-throw-insert-23.6-plus
    parameter: clickhouse.active_parts_throw_threshold
    system: clickhouse
    applies_to: ClickHouse >=23.6 (parts_to_throw_insert default; verified v23.6.1 and v24.3.1-lts)
    value: 3000
    confidence: code
    source: clickhouse-mergetree-settings-v23.6
    quote: >-
      M(UInt64, parts_to_throw_insert, 3000, "If more than this number active
      parts in single partition, throw 'Too many parts ...' exception.", 0)
    notes: >-
      Post-23.6 reject ceiling (10× the pre-23.6 default). Primary answer of
      clickhouse.parts-insert-ceiling until a deployment pins an older release.

  - slug: clickhouse.max-delay-to-insert-seconds
    parameter: clickhouse.max_insert_delay_seconds
    system: clickhouse
    applies_to: ClickHouse v23.5.1 through v24.3.1-lts (max_delay_to_insert default)
    value: 1
    confidence: code
    source: clickhouse-mergetree-settings-v23.6
    quote: >-
      M(UInt64, max_delay_to_insert, 1, "Max delay of inserting data into
      MergeTree table in seconds, if there are a lot of unmerged parts in
      single partition.", 0)
    notes: >-
      Same default (1s) on both sides of 23.6 in the headers retrieved for
      investigation 012. Caps how long artificial INSERT sleep can last once
      parts_to_delay_insert has been crossed — not the part-count threshold
      itself.
