# MongoDB / WiredTiger coefficients.
#
# Every row names the versions it is true for. WiredTiger's eviction defaults
# are published per MongoDB release precisely because they are not promised to
# be stable, so a bare "80%" here would be a figure with no shelf life.

coefficients:
  # -- eviction thresholds ----------------------------------------------
  - slug: mongodb.eviction-target-pct
    parameter: cache.eviction_target_pct
    system: mongodb
    applies_to: MongoDB 6.0 (WiredTiger default; unchanged since WiredTiger 2.x)
    value: 80
    confidence: documented
    source: wiredtiger-tune-cache-mongodb-6.0
    quote: >-
      The eviction_target configuration value (default 80%) is the level at
      which WiredTiger attempts to keep the overall cache usage.
    notes: >-
      This is the coefficient that makes "how big must the cache be" a
      different question from "how many bytes am I caching". WiredTiger runs
      eviction workers to hold usage at 80%, so a working set of N bytes wants
      a cache of about N/0.8 before background eviction stops fighting it.

  - slug: mongodb.eviction-trigger-pct
    parameter: cache.eviction_trigger_pct
    system: mongodb
    applies_to: MongoDB 6.0 (WiredTiger default)
    value: 95
    confidence: documented
    source: wiredtiger-tune-cache-mongodb-6.0
    quote: >-
      The eviction_trigger configuration value (default 95%) is the level at
      which application threads start to perform eviction.
    notes: >-
      Not used in the arithmetic. Carried because it names the failure mode:
      past 95% your queries are doing the eviction, and the symptom is
      latency, not an out-of-memory error. Anyone reading this model to decide
      whether they are in trouble needs the number they will actually see in a
      trace.

  - slug: mongodb.eviction-dirty-target-pct
    parameter: cache.eviction_dirty_target_pct
    system: mongodb
    applies_to: MongoDB 6.0 (WiredTiger default)
    value: 5
    confidence: documented
    source: wiredtiger-tune-cache-mongodb-6.0
    quote: >-
      The eviction_dirty_target (default 5%) and eviction_dirty_trigger
      (default 20%) operate in a similar way to the overall targets, but only
      apply to dirty data in cache.

  - slug: mongodb.eviction-dirty-trigger-pct
    parameter: cache.eviction_dirty_trigger_pct
    system: mongodb
    applies_to: MongoDB 6.0 (WiredTiger default)
    value: 20
    confidence: documented
    source: wiredtiger-tune-cache-mongodb-6.0
    quote: >-
      The eviction_dirty_target (default 5%) and eviction_dirty_trigger
      (default 20%) operate in a similar way to the overall targets, but only
      apply to dirty data in cache.
    notes: >-
      The ceiling a bulk load hits first. A cache sized correctly for total
      bytes still throttles here if the writes outrun checkpointing, which is
      why a sizing answer alone never settles a write-heavy incident.

  # -- the default split -------------------------------------------------
  - slug: mongodb.cache-default-share-pct
    parameter: host.cache_default_share_pct
    system: mongodb
    applies_to: MongoDB >=3.4 through 8.3
    value: 50
    confidence: documented
    source: mongodb-manual-wiredtiger
    quote: >-
      The default WiredTiger internal cache size is the larger of either: 50%
      of (RAM - 1GB), or 0.256 GB.
    notes: >-
      The other 50% is not spare. It is the filesystem cache, which holds the
      same data in its on-disk form — compressed. Byte for byte that cache
      holds more of the database than the WiredTiger cache does, which is the
      mechanical reason the vendor advises against raising the split.

  - slug: mongodb.cache-default-reserve-bytes
    parameter: host.default_reserve_bytes
    system: mongodb
    applies_to: MongoDB >=3.4 through 8.3
    value: 1000000000
    confidence: documented
    source: mongodb-manual-wiredtiger
    quote: >-
      The default WiredTiger internal cache size is the larger of either: 50%
      of (RAM - 1GB), or 0.256 GB.
    notes: >-
      Held back before the split, for the operating system and mongod itself.
      Recorded as 1 GB decimal to match how the documentation writes it; the
      difference from 1 GiB is noise at any size where this question matters.

  # -- compression -------------------------------------------------------
  - slug: mongodb.compression-ratio-snappy
    parameter: storage.compression_ratio
    system: mongodb
    applies_to: MongoDB >=3.0 with the default snappy block compressor
    value_lo: 1.5
    value_mode: 2.5
    value_hi: 3.5
    confidence: practitioner
    source: percona-mongodb-compression-snappy-zstd
    quote: >-
      Typical compression ratios on log data show Snappy achieving ~2.5x
      compression, Zlib ~3.5x compression, and Zstd ~4.0x compression.
    notes: >-
      The widest band in the corpus, and honestly so. The published figure is
      measured on log data, which compresses far better than a collection that
      is mostly ObjectIds, numbers and short keys. The low end is there for
      exactly that case.

      If you can run db.stats() against the real database, do — dataSize is
      the measured answer and beats this range outright. This coefficient is
      for when all you have been handed is "it's a 500 GB database".

  - slug: mongodb.compression-ratio-zstd
    parameter: storage.compression_ratio
    system: mongodb
    applies_to: MongoDB >=4.2 with the zstd block compressor
    value_lo: 2.5
    value_mode: 4.0
    value_hi: 5.5
    confidence: practitioner
    source: percona-mongodb-compression-snappy-zstd
    quote: >-
      Typical compression ratios on log data show Snappy achieving ~2.5x
      compression, Zlib ~3.5x compression, and Zstd ~4.0x compression.
    notes: >-
      Unused by the shipped model, which assumes the default compressor.
      Present so a zstd variant is a YAML edit rather than a code change —
      and because a better disk ratio makes the cache problem WORSE, not
      better: the same on-disk bytes decompress to more cache bytes.

  - slug: mongodb.compression-ratio-zlib
    parameter: storage.compression_ratio
    system: mongodb
    applies_to: MongoDB >=3.0 with the zlib block compressor
    value_lo: 2.0
    value_mode: 3.5
    value_hi: 5.0
    confidence: practitioner
    source: percona-mongodb-compression-snappy-zstd
    quote: >-
      Typical compression ratios on log data show Snappy achieving ~2.5x
      compression, Zlib ~3.5x compression, and Zstd ~4.0x compression.

  # -- admission control, and the version that changed it ----------------
  - slug: mongodb.tickets-static-cap
    parameter: db.concurrency_tickets
    system: mongodb
    applies_to: MongoDB 3.x through 6.x (static wiredTigerConcurrent*Transactions)
    value: 128
    confidence: documented
    source: mongodb-performance-tuning-7.0
    quote: >-
      The read and write tickets control the maximum number of concurrent
      transactions. The WiredTiger ticket number should always be at 128.
      Sustained values below 128 indicates a server delay and consequential
      potential issues.
    notes: >-
      128 read and 128 write, separately. The number that sets the throughput
      ceiling whenever storage is slow: no matter how many clients connect,
      only 128 operations can be inside the engine, so the sustainable rate is
      128 divided by how long each one takes.

  - slug: mongodb.tickets-probing-floor
    parameter: db.concurrency_tickets
    system: mongodb
    applies_to: MongoDB >=7.0 (throughputProbingMinConcurrency default)
    value: 4
    confidence: practitioner
    source: percona-mongodb-concurrency-algorithm
    notes: >-
      The floor the 7.0 throughputProbing algorithm may reduce concurrency to,
      and the reason this investigation exists.

      MongoDB documents the dynamic algorithm and its purpose — "optimizing
      database throughput during cluster overload" — without publishing the
      floor. Percona does: min 4, max 128.

      A 32x range in the term that divides into the throughput ceiling — and
      the floor is where an idle instance SITS. Measured on MongoDB 7.0.39
      (swamplink, 2026-07-31): read and write pools both reported
      totalTickets = 4 at rest. So on 7.0+ the pre-7.0 assumption of "128
      tickets" is not a conservative simplification, it is wrong by 32x in the
      dangerous direction.

      Kept at `practitioner` rather than promoted to `measured` because the
      observation confirms the resting VALUE while Percona is the source for it
      being the algorithm's documented floor. The observation is recorded
      separately as swamplink-2026-07-31-read-tickets-idle.

      Still open, and it is the difference between a bad hour and an outage:
      whether the algorithm climbs from the floor under load, and whether it
      climbs when the bottleneck is the device rather than concurrency. See
      docs/investigations/003-storage-stall-query-collapse/FINDINGS.md.

  - slug: mongodb.tickets-probing-cap
    parameter: db.concurrency_tickets
    system: mongodb
    applies_to: MongoDB >=7.0 (throughputProbingMaxConcurrency default)
    value: 128
    confidence: practitioner
    source: percona-mongodb-concurrency-algorithm
    notes: >-
      The ceiling of the dynamic range, unchanged from the old static value —
      so 7.0 did not raise the maximum, it lowered the typical. Percona notes
      the algorithm "starts with a much lower baseline number of available
      tickets" than the pre-7.0 constant.

  - slug: mongodb.cache-minimum-bytes
    parameter: cache.size_bytes
    system: mongodb
    applies_to: MongoDB >=3.4 through 8.3
    value: 268435456
    confidence: documented
    source: mongodb-manual-wiredtiger
    quote: >-
      The default WiredTiger internal cache size is the larger of either: 50%
      of (RAM - 1GB), or 0.256 GB.
    notes: >-
      The second branch of the default formula, and the one the model ignored
      until 2026-08-02. "0.256 GB" is written decimally in the documentation
      but the implementation uses 256 MiB — measured at 268,435,456 bytes on a
      MongoDB 7.0.39 container capped at 1 GiB, where 0.5 x (1 GiB - 1 GB) is
      about 37 MB and this branch therefore binds.

      That measurement also established that MongoDB sizes the cache from the
      CGROUP limit rather than host RAM, and that hostInfo().system.memSizeMB
      reports host RAM inside a capped container while memLimitMB reports the
      cap. Validating against memSizeMB would compare every container to the
      same number.
