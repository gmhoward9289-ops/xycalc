# MongoDB / WiredTiger coefficients.
#
# Every row names the versions it is true for. WiredTiger's eviction defaults
# are published per MongoDB release precisely because they are not promised to
# be stable, so a bare "80%" here would be a figure with no shelf life.

coefficients:
  # -- eviction thresholds ----------------------------------------------
  - slug: mongodb.eviction-target-pct
    parameter: cache.eviction_target_pct
    system: mongodb
    applies_to: MongoDB 6.0 (WiredTiger default; unchanged since WiredTiger 2.x)
    value: 80
    confidence: documented
    source: wiredtiger-tune-cache-mongodb-6.0
    quote: >-
      The eviction_target configuration value (default 80%) is the level at
      which WiredTiger attempts to keep the overall cache usage.
    notes: >-
      This is the coefficient that makes "how big must the cache be" a
      different question from "how many bytes am I caching". WiredTiger runs
      eviction workers to hold usage at 80%, so a working set of N bytes wants
      a cache of about N/0.8 before background eviction stops fighting it.

  - slug: mongodb.eviction-trigger-pct
    parameter: cache.eviction_trigger_pct
    system: mongodb
    applies_to: MongoDB 6.0 (WiredTiger default)
    value: 95
    confidence: documented
    source: wiredtiger-tune-cache-mongodb-6.0
    quote: >-
      The eviction_trigger configuration value (default 95%) is the level at
      which application threads start to perform eviction.
    notes: >-
      Not used in the arithmetic. Carried because it names the failure mode:
      past 95% your queries are doing the eviction, and the symptom is
      latency, not an out-of-memory error. Anyone reading this model to decide
      whether they are in trouble needs the number they will actually see in a
      trace.

  - slug: mongodb.eviction-dirty-target-pct
    parameter: cache.eviction_dirty_target_pct
    system: mongodb
    applies_to: MongoDB 6.0 (WiredTiger default)
    value: 5
    confidence: documented
    source: wiredtiger-tune-cache-mongodb-6.0
    quote: >-
      The eviction_dirty_target (default 5%) and eviction_dirty_trigger
      (default 20%) operate in a similar way to the overall targets, but only
      apply to dirty data in cache.

  - slug: mongodb.eviction-dirty-trigger-pct
    parameter: cache.eviction_dirty_trigger_pct
    system: mongodb
    applies_to: MongoDB 6.0 (WiredTiger default)
    value: 20
    confidence: documented
    source: wiredtiger-tune-cache-mongodb-6.0
    quote: >-
      The eviction_dirty_target (default 5%) and eviction_dirty_trigger
      (default 20%) operate in a similar way to the overall targets, but only
      apply to dirty data in cache.
    notes: >-
      The ceiling a bulk load hits first — in the documented mechanism. A
      cache sized correctly for total bytes still throttles here if the
      writes outrun checkpointing. Investigation 014 (T3) on MongoDB 7.0.40
      under a Docker cgroup write throttle did not observe dirty% approaching
      20% or pages-evicted-by-application-threads rising: peak dirty stayed
      ~2.5–4% (near dirty_target) while inserts self-limited to device rate
      or background eviction kept dirty low. Documented 20% unchanged;
      measured onset absent under this harness (see FINDINGS).

  - slug: mongodb.checkpoint-interval-seconds
    parameter: storage.checkpoint_interval_seconds
    system: mongodb
    applies_to: MongoDB 7.0 (WiredTiger checkpoints as configured by mongod)
    value: 60
    confidence: documented
    source: mongodb-manual-wiredtiger-v7.0-checkpoints
    quote: >-
      MongoDB configures WiredTiger to create checkpoints, specifically,
      writing the snapshot data to disk at intervals of 60 seconds.
    notes: >-
      storage.syncPeriodSecs / --syncdelay default. Load-bearing for T3
      duration (≥3× interval per level) and for T4 checkpoint-sawtooth work.

  # -- the default split -------------------------------------------------
  - slug: mongodb.cache-default-share-pct
    parameter: host.cache_default_share_pct
    system: mongodb
    applies_to: MongoDB >=3.4 through 8.3
    value: 50
    confidence: documented
    source: mongodb-manual-wiredtiger
    quote: >-
      The default WiredTiger internal cache size is the larger of either: 50%
      of (RAM - 1GB), or 0.256 GB.
    notes: >-
      The other 50% is not spare. It is the filesystem cache, which holds the
      same data in its on-disk form — compressed. Byte for byte that cache
      holds more of the database than the WiredTiger cache does, which is the
      mechanical reason the vendor advises against raising the split.

      Forward-checked 2026-08-21 on unpinned mongo:7.0.39 (cooper-hostram):
      cache matched 0.5 × (RAM − 1 GiB) within ~0.03% when hostInfo agreed
      with the RAM mongod used. On Docker Desktop, a 2 GiB --memory cgroup
      sized the cache correctly while hostInfo still reported the ~4 GiB VM —
      container sizing can diverge from hostInfo; see
      obs-cooper-hostram-2026-08-21.

  - slug: mongodb.cache-default-reserve-bytes
    parameter: host.default_reserve_bytes
    system: mongodb
    applies_to: MongoDB >=3.4 through 8.3
    value: 1000000000
    confidence: documented
    source: mongodb-manual-wiredtiger
    quote: >-
      The default WiredTiger internal cache size is the larger of either: 50%
      of (RAM - 1GB), or 0.256 GB.
    notes: >-
      Held back before the split, for the operating system and mongod itself.
      Recorded as 1 GB decimal to match how the documentation writes it; the
      difference from 1 GiB is noise at any size where this question matters.

  # -- compression -------------------------------------------------------
  - slug: mongodb.compression-ratio-snappy
    parameter: storage.compression_ratio
    system: mongodb
    applies_to: MongoDB >=3.0 with the default snappy block compressor
    value_lo: 1.5
    value_mode: 2.5
    value_hi: 3.5
    confidence: practitioner
    source: percona-mongodb-compression-snappy-zstd
    quote: >-
      Typical compression ratios on log data show Snappy achieving ~2.5x
      compression, Zlib ~3.5x compression, and Zstd ~4.0x compression.
    notes: >-
      The widest band in the corpus, and honestly so. The published figure is
      measured on log data, which compresses far better than a collection that
      is mostly ObjectIds, numbers and short keys. The low end is there for
      exactly that case.

      Survived contact with several real (demo-curated) document shapes on
      snappy, MongoDB 7.0.39 — issue #5 Track A, obs-mongodb-compression-2026-08-21
      and obs-mongodb-compression-batch2-2026-08-21: sample ratios 1.73–3.49
      (mflix 1.75, airbnb 1.73, companies 2.21, tweets 2.54, inspections 2.78,
      grades 3.49). All inside 1.5–3.5; spread uses most of the band. Band not
      narrowed on Track A alone.

      Investigation 010 / T2 (obs-swamplink-compression-shape-2026-08-21)
      manufactured the synthetic extremes on the same MongoDB 7.0.39: snappy
      ratios 0.99 (pure-random) through 9.17 (near-duplicate). That is wider
      than this band at both ends. The band is kept as a practitioner prior
      for application-shaped data; synthetic extremes are documented, not
      folded into lo/hi. Prefer db.stats() whenever available. One earlier
      synthetic high-entropy point at 1.42× sits with the T2 floor (~1.0).
      Production db.stats() samples (Track B) remain welcome.

      If you can run db.stats() against the real database, do — dataSize is
      the measured answer and beats this range outright. This coefficient is
      for when all you have been handed is "it's a 500 GB database".

  - slug: mongodb.compression-ratio-zstd
    parameter: storage.compression_ratio
    system: mongodb
    applies_to: MongoDB >=4.2 with the zstd block compressor
    value_lo: 2.5
    value_mode: 4.0
    value_hi: 5.5
    confidence: practitioner
    source: percona-mongodb-compression-snappy-zstd
    quote: >-
      Typical compression ratios on log data show Snappy achieving ~2.5x
      compression, Zlib ~3.5x compression, and Zstd ~4.0x compression.
    notes: >-
      Unused by the shipped model, which assumes the default compressor.
      Present so a zstd variant is a YAML edit rather than a code change —
      and because a better disk ratio makes the cache problem WORSE, not
      better: the same on-disk bytes decompress to more cache bytes.

  - slug: mongodb.compression-ratio-zlib
    parameter: storage.compression_ratio
    system: mongodb
    applies_to: MongoDB >=3.0 with the zlib block compressor
    value_lo: 2.0
    value_mode: 3.5
    value_hi: 5.0
    confidence: practitioner
    source: percona-mongodb-compression-snappy-zstd
    quote: >-
      Typical compression ratios on log data show Snappy achieving ~2.5x
      compression, Zlib ~3.5x compression, and Zstd ~4.0x compression.

  # -- admission control, and the version that changed it ----------------
  - slug: mongodb.tickets-static-cap
    parameter: db.concurrency_tickets
    system: mongodb
    applies_to: MongoDB 3.x through 6.x (static wiredTigerConcurrent*Transactions)
    value: 128
    confidence: documented
    source: mongodb-performance-tuning-7.0
    quote: >-
      The read and write tickets control the maximum number of concurrent
      transactions. The WiredTiger ticket number should always be at 128.
      Sustained values below 128 indicates a server delay and consequential
      potential issues.
    notes: >-
      128 read and 128 write, separately. The number that sets the throughput
      ceiling whenever storage is slow: no matter how many clients connect,
      only 128 operations can be inside the engine, so the sustainable rate is
      128 divided by how long each one takes.

  - slug: mongodb.tickets-probing-floor
    parameter: db.concurrency_tickets
    system: mongodb
    applies_to: >-
      MongoDB >=7.0 through 8.2.12 (throughputProbingMinConcurrency default;
      value confirmed idle on 7.0.39, 8.0.29, 8.2.12)
    value: 4
    confidence: practitioner
    source: percona-mongodb-concurrency-algorithm
    notes: >-
      The floor the 7.0 throughputProbing algorithm may reduce concurrency to,
      and the reason this investigation exists.

      MongoDB documents the dynamic algorithm and its purpose — "optimizing
      database throughput during cluster overload" — without publishing the
      floor. Percona does: min 4, max 128.

      A 32x range in the term that divides into the throughput ceiling — and
      the floor is where an idle instance SITS. Measured on MongoDB 7.0.39
      (swamplink, 2026-07-31): read and write pools both reported
      totalTickets = 4 at rest. Confirmed again on idle 8.0.29 and 8.2.12
      (cooper-2026-08-21-*-tickets-idle-8.*): same floor of 4.

      Field path moved between majors. On 7.0.39 the figure is under
      wiredTiger.concurrentTransactions; on 8.0.29 and 8.2.12 that object is
      gone and the same numbers live under queues.execution.{read,write}.
      See docs/telemetry/mongodb.md and obs-mongodb-tickets-cooper-2026-08-21.

      Kept at `practitioner` rather than promoted to `measured` because the
      observation confirms the resting VALUE while Percona is the source for it
      being the algorithm's documented floor. The observations are recorded
      separately (swamplink-2026-07-31-*-tickets-idle,
      cooper-2026-08-21-*-tickets-idle-8.*).

      Still open, and it is the difference between a bad hour and an outage:
      whether the algorithm climbs from the floor under load, and whether it
      climbs when the bottleneck is the device rather than concurrency. See
      docs/investigations/003-storage-stall-query-collapse/FINDINGS.md.

  - slug: mongodb.tickets-probing-cap
    parameter: db.concurrency_tickets
    system: mongodb
    applies_to: >-
      MongoDB >=7.0 through 8.2.12 (throughputProbingMaxConcurrency default;
      telemetry path confirmed on 7.0.39 / 8.0.29 / 8.2.12)
    value: 128
    confidence: practitioner
    source: percona-mongodb-concurrency-algorithm
    notes: >-
      The ceiling of the dynamic range, unchanged from the old static value —
      so 7.0 did not raise the maximum, it lowered the typical. Percona notes
      the algorithm "starts with a much lower baseline number of available
      tickets" than the pre-7.0 constant. Cap applies_to is capped at the
      last version whose ticket telemetry path was checked (8.2.12); the
      documented max itself was not re-probed under load on 8.x.

  - slug: mongodb.tickets-idle-hold-seconds-min
    parameter: db.concurrency_tickets
    system: mongodb
    applies_to: MongoDB 7.0.39 (throughputProbing defaults)
    value: 611
    confidence: practitioner
    source: obs-mongodb-ticket-decay-swamplink-2026-08-19
    notes: >-
      A lower bound, not a rate: totalTickets held at 64 (its value when a
      600s load stopped) for at least 611 seconds of true idle -- 123
      samples every 5s, zero movement, read.out at 0 throughout so the
      sampler's own polling is confirmed not to be the load. throughputProbing
      does not walk the pool back toward the documented floor of 4 on
      elapsed idle time alone.

      This falsifies the framing (used by issue #3 and, before this, by this
      corpus's own `tickets` input note below) that "resting at 4" is simply
      what a busy instance settles back to once things calm down. It is not
      a timer. The likelier mechanism, not yet directly confirmed: the
      algorithm is a hill-climbing controller that adjusts concurrency based
      on a recent throughput sample, and at zero client operations there is
      no throughput sample to react to, so it freezes rather than decaying.
      Indirect support for that mechanism from the same run: during the
      LOAD phase itself (not after), totalTickets peaked at 77 and eased
      back to 64 by the time the 600s window closed -- the controller
      reduced concurrency while load was still running, which is what you'd
      expect from "adjusts toward a throughput signal" and not from "counts
      down on a clock".

      Untested by this run: whether a low, nonzero trickle of subsequent
      traffic (rather than true zero) would drive the pool back down, and on
      what timescale. n=1, one host, one duration -- do not read 611s as a
      ceiling on how long the freeze lasts, only as how long it was observed
      to hold in this run. See
      docs/investigations/003-storage-stall-query-collapse/FINDINGS.md and
      docs/plans/issue-3-ticket-pool-convergence-and-decay.md.

  - slug: mongodb.cache-minimum-bytes
    parameter: cache.size_bytes
    system: mongodb
    applies_to: MongoDB >=3.4 through 8.3
    value: 268435456
    confidence: documented
    source: mongodb-manual-wiredtiger
    quote: >-
      The default WiredTiger internal cache size is the larger of either: 50%
      of (RAM - 1GB), or 0.256 GB.
    notes: >-
      The second branch of the default formula, and the one the model ignored
      until 2026-08-02. "0.256 GB" is written decimally in the documentation
      but the implementation uses 256 MiB — measured at 268,435,456 bytes on a
      MongoDB 7.0.39 container capped at 1 GiB, where 0.5 x (1 GiB - 1 GB) is
      about 37 MB and this branch therefore binds.

      That measurement also established that MongoDB sizes the cache from the
      CGROUP limit rather than host RAM, and that hostInfo().system.memSizeMB
      reports host RAM inside a capped container while memLimitMB reports the
      cap. Validating against memSizeMB would compare every container to the
      same number.

  # -- capacity planning (informational only; the model term is caller-input,
  #    not this coefficient — see mongodb.wt-cache's growth_buffer_pct) ------
  - slug: mongodb.capacity-buffer-default-pct
    parameter: host.capacity_buffer_pct
    system: mongodb
    applies_to: >-
      Not a MongoDB property — a generic planning default: 15-40%/year
      database growth compounded over a 2-year horizon, offered only for
      when the caller has no growth curve of their own.
    value_lo: 32.25
    value_mode: 56.25
    value_hi: 96
    confidence: estimate
    source: xycalc-capacity-planning-default
    notes: >-
      OUR REASONING, NOT A VENDOR FIGURE. Computed as (1 + annual_growth)^years
      - 1 at three annual-growth assumptions over a fixed 2-year horizon: 15%
      (lo), 25% (mode), 40% (hi). Both the growth rate and the horizon are
      exactly the two things `--growth-buffer-pct` lets a caller override —
      this coefficient exists purely so that default has a citable origin
      instead of being an unexplained 35% (or any other number) baked into
      code. Never evaluated automatically; surfaced only as a note alongside
      the model's answer.

  # -- GridFS / BSON document ceiling (enrichment 2026-08-20) -------------
  - slug: mongodb.bson-max-document-bytes
    parameter: storage.bson_max_document_bytes
    system: mongodb
    applies_to: MongoDB BSON document size limit (manual through 8.3)
    value: 16777216
    confidence: documented
    source: mongodb-manual-gridfs
    quote: >-
      GridFS is a specification for storing and retrieving files that exceed
      the BSON-document size limit of 16 MiB.
    notes: >-
      16 MiB = 16 × 1024 × 1024. The branch point between "store BinData in
      one document" and "use GridFS (or object storage)". Not a soft
      recommendation — documents above this are rejected.

  - slug: mongodb.gridfs-chunk-size-bytes
    parameter: storage.gridfs_chunk_size_bytes
    system: mongodb
    applies_to: GridFS default across conforming drivers (spec + manual 8.3)
    value: 261120
    confidence: documented
    source: mongodb-manual-gridfs
    quote: >-
      By default, GridFS uses a chunk size of 255 KiB; that is, GridFS divides
      a file into chunks of 255 KiB with the exception of the last chunk.
    notes: >-
      255 × 1024 = 261,120 bytes. Configurable per file / GridFSBucket.
      Storage floor for a file of length L is roughly ceil(L / 261120) chunk
      documents plus one files metadata document — vendor does not publish a
      fixed per-chunk BSON overhead constant beyond this payload size.

  - slug: mongodb.gridfs-mmapv1-padding-slot-bytes
    parameter: storage.gridfs_mmapv1_padding_slot_bytes
    system: mongodb
    applies_to: GridFS spec design rationale (MMAPv1-era; still shapes default)
    value: 262144
    confidence: documented
    source: mongodb-gridfs-spec
    quote: >-
      When the "data" field of a chunk is limited to 255 KiB, it ensures that
      the whole chunk document (the chunk data along with an `_id` and other
      information) will fit into a 256 KiB section of memory, making the best
      use of the provided padding.
    notes: >-
      256 KiB = 262,144. Explains why the default is 255 KiB rather than 256.
      Spec explicitly says WiredTiger does not need this padding optimisation;
      the default remains for driver uniformity. Not an operational WiredTiger
      cache coefficient.

  # -- Foreign / related fields -------------------------------------------
  - slug: mongodb.objectid-bytes
    parameter: storage.objectid_bytes
    system: mongodb
    applies_to: BSON ObjectId type (manual through 8.3)
    value: 12
    confidence: documented
    source: mongodb-manual-bson-types
    quote: >-
      ObjectId values are 12 bytes in length, consisting of: A 4-byte
      timestamp, representing the ObjectId's creation, measured in seconds
      since the Unix epoch.
    notes: >-
      Floor for a manual reference field that stores another document's _id.
      A DBRef carries $ref / $id / optional $db on top of this and still needs
      a second query (or $lookup) to resolve — no vendor latency multiplier
      published for that second hop.

  - slug: mongodb.prefer-manual-refs-over-dbref
    parameter: schema.prefer_manual_refs_over_dbref
    system: mongodb
    applies_to: MongoDB database-references guidance (manual through 8.3)
    value: 1
    confidence: documented
    source: mongodb-manual-database-references
    quote: >-
      Unless you have a compelling reason to use DBRefs, use manual references
      instead.
    notes: >-
      Encoded 1 = vendor prefers manual refs. Qualitative schema guidance,
      not a sizing amplifier. $lookup remains the documented join for
      normalised models; reduce-lookup antipattern docs say frequent $lookup
      is slow vs embedding, without a numeric factor this corpus can cite.

  # -- PyMongo / driver pool defaults -------------------------------------
  - slug: mongodb.pymongo-max-pool-size
    parameter: driver.max_pool_size
    system: mongodb
    applies_to: PyMongo MongoClient connection pool default (docs 2026-08-20)
    value: 100
    confidence: documented
    source: pymongo-connection-pools
    quote: >-
      maxPoolSize — The maximum number of concurrent connections that the pool
      maintains. If the maximum pool size is reached, further requests wait
      until a connection becomes available. Default: 100
    notes: >-
      Per MongoClient. Celery prefork with N child processes and one client
      each implies up to N × 100 connections toward mongod — orthogonal to
      WiredTiger ticket concurrency (128/dynamic). Does not size per-connection
      server RAM (still uncited).

  - slug: mongodb.pymongo-min-pool-size
    parameter: driver.min_pool_size
    system: mongodb
    applies_to: PyMongo MongoClient connection pool default (docs 2026-08-20)
    value: 0
    confidence: documented
    source: pymongo-connection-pools
    quote: >-
      minPoolSize — The minimum number of concurrent connections that the pool
      maintains. If the number of open connections falls below this value due
      to network errors, PyMongo attempts to create new connections to maintain
      this minimum. Default: 0

  - slug: mongodb.pymongo-max-connecting
    parameter: driver.max_connecting
    system: mongodb
    applies_to: PyMongo MongoClient connection pool default (docs 2026-08-20)
    value: 2
    confidence: documented
    source: pymongo-connection-pools
    quote: >-
      maxConnecting — The maximum number of connections that each pool can
      establish concurrently. If this limit is reached, further requests wait
      until a connection is established or another in-use connection is checked
      back into the pool. Default: 2
    notes: >-
      Connection-string options manual also defaults maxConnecting to 2 and
      warns that raising it speeds establishment but increases connection-storm
      risk. Client-side throttle, not a server ticket.

  - slug: mongodb.pymongo-connect-timeout-ms
    parameter: driver.connect_timeout_ms
    system: mongodb
    applies_to: PyMongo MongoClient connection pool default (docs 2026-08-20)
    value: 20000
    confidence: documented
    source: pymongo-connection-pools
    quote: >-
      connectTimeoutMS — The time that PyMongo waits when establishing a new
      connection before timing out. Default: 20000

  # -- Vertical growth: percentage cache ceiling (MongoDB 8.2+) -----------
  - slug: mongodb.cache-size-pct-ceiling
    parameter: host.cache_size_pct_ceiling
    system: mongodb
    applies_to: MongoDB >=8.2 wiredTigerCacheSizePct / cacheSizePct
    value: 80
    confidence: documented
    source: mongodb-manual-wiredtiger
    quote: >-
      Avoid increasing the WiredTiger internal cache size above its default
      value. If your case requires to do so, you can use --wiredTigerCacheSizePct
      to account for changes in memory due to vertical. You must specify a
      percentage of up to 80% of available memory.
    notes: >-
      Vertical-growth knob, not a replacement for the default 50%-of-(RAM-1GB)
      formula. Vendor still says avoid raising the cache above default; the
      percentage form exists so the cache tracks host RAM when the instance
      grows. Calculated values still clamp to the 0.256 GB minimum branch.
      Colocation (multiple mongod / Redis / ClickHouse on one box) still
      needs an explicit share decision — investigation 009 (AWS T11 share
      sweep) found neighbor RSS flat from 50%→80% WT share under 2.5×
      oversub on a host that was not at its RAM ceiling. That is a
      documented absence of neighbor RSS effect under that harness, not a
      replacement coefficient for the vendor 50–70% band. See
      docs/investigations/009-colocation-share/FINDINGS.md and
      docs/research/mongodb-vertical-scaling-r8.md §7.
