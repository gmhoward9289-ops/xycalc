# Azure memory-optimized VM catalog (Esv5, Esv6).
#
# Same shape as data/coefficients/aws-ec2.yaml: each row is a published spec
# (lo == mode == hi), grouped so select_instance() can name the smallest SKU
# covering each end of a RAM band. Catalog names are prefixed Esv5./Esv6. so
# `--family Esv5` / `--family Esv6` filter the way `r8i` does; the Microsoft
# size name follows (Standard_E2s_v5, …).
#
# Sourced from the Microsoft Learn size-series pages (azure-compute-docs
# markdown that Learn publishes, retrieved 2026-08-21). Isolated SKUs
# (Standard_E104is_v5, Standard_E192is_v6) and other E-family variants
# (Eds, Eas, Eb, …) are omitted — a smaller sourced catalog, not a guessed
# one. E192is_v6's 1,832 GB table cell also disagrees with the Esv6
# host-spec include (16–1024 GiB). Bare-metal classes are out of scope.

coefficients:
  # -- Esv5: Intel memory-optimized, premium storage, no local temp disk.

  - slug: azure.esv5.e2s.ram-bytes
    parameter: host.ram_bytes
    system: azure-vm
    applies_to: Esv5.Standard_E2s_v5, Azure Esv5 series, ms.date 2026-03-10
    value: 17179869184  # 16 GiB
    confidence: documented
    source: azure-vm-esv5-series
    quote: "Size Name | vCPUs (Qty.) | Memory (GB): Standard_E2s_v5 | 2 | 16"
    notes: >-
      Memory column is labelled GB; the series host-specifications include on
      the same Learn page states the range in GiB, and the published size
      numbers match that GiB range, so this row is stored as binary GiB.
