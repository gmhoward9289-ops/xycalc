# NVD / CVE publication growth coefficients.
#
# Bands are estimates from 2023–2025 publication rates cited in Jerry
# Gamblin's annual CVE reviews. They are not a forecast — they bracket how
# fast the corpus has been growing recently.

coefficients:
  - slug: nvd.cve-yoy-growth-pct
    parameter: vuln.yoy_growth_pct
    system: nvd
    applies_to: CVE publication rate, 2023–2025
    value_lo: 15
    value_mode: 21
    value_hi: 39
    confidence: practitioner
    source: jerrygamblin-2025-cve-review
    quote: >-
      48,185 CVEs were published in 2025, a 20.6% increase from the 40,009
      CVEs published in 2024.
    notes: >-
      Mode sits near the 2024→2025 rate (20.6%). Lo/hi bracket the 2023→2024
      spike (38.8%) and a softer continuation. Carried for single-year
      add_fraction projections; the storage model defaults to the compound
      multiplier below for a three-year horizon.

  - slug: nvd.cve-growth-3yr-multiplier
    parameter: vuln.compound_growth_multiplier
    system: nvd
    applies_to: >-
      Compound growth over three years at ~21% YoY CVE publication rate
    value_lo: 1.5
    value_mode: 2.0
    value_hi: 2.5
    confidence: practitioner
    source: jerrygamblin-2025-cve-review
    quote: >-
      48,185 CVEs were published in 2025, a 20.6% increase from the 40,009
      CVEs published in 2024.
    notes: >-
      Approximate (1 + growth/100)^3 bands: 15%→1.52, 21%→1.77, 39%→2.68.
      Used when no explicit target_vuln_count is supplied and
      projection_years defaults to three. For other horizons, supply a
      target count or run single-year add_fraction manually.

  # Annual publication counts — chart series, not model terms. Point values
  # (lo=mode=hi) because they are counted totals from the cited reviews.

  - slug: nvd.cves-published-2023
    parameter: vuln.count
    system: nvd
    applies_to: CVE records published in 2023, excluding rejected
    value: 28818
    confidence: practitioner
    source: jerrygamblin-2024-cve-review
    quote: >-
      We ended 2024 with 40,009 published CVEs, up over 38% from the 28,818
      CVEs published in 2023.

  - slug: nvd.cves-published-2024
    parameter: vuln.count
    system: nvd
    applies_to: CVE records published in 2024, excluding rejected
    value: 40009
    confidence: practitioner
    source: jerrygamblin-2024-cve-review
    quote: We ended 2024 with 40,009 published CVEs, up over 38% from the 28,818 CVEs published in 2023.
    notes: >-
      Contemporaneous 2024 count. The 2025 review restates 2024 as 39,962
      when computing the 20.6% YoY figure. This corpus keeps 40,009 as the
      2024 bar and cites both reviews.

  - slug: nvd.cves-published-2025
    parameter: vuln.count
    system: nvd
    applies_to: CVE records published in 2025, excluding rejected
    value: 48185
    confidence: practitioner
    source: jerrygamblin-2025-cve-review
    quote: In 2025, 48,185 CVEs were published, a 20.6% increase from 2024’s 39,962.

  - slug: nvd.cves-cumulative-through-2025
    parameter: vuln.count
    system: nvd
    applies_to: Cumulative CVE records since 1999, through 2025, excluding rejected
    value: 308920
    confidence: practitioner
    source: jerrygamblin-2025-cve-review
    quote: The total number of CVEs since 1999 now stands at 308,920.

  - slug: nvd.microsoft-cves-published-2025
    parameter: vuln.count
    system: nvd
    applies_to: Microsoft as vendor, CVE records published in 2025, excluding rejected
    value: 1255
    confidence: practitioner
    source: jerrygamblin-2025-cve-review
    quote: >-
      Top 5 Vendors in 2025 — Rank 2 Microsoft, CVE Count 1,255.
    notes: >-
      Vendor attribution from the same review as the NVD annual totals, so it
      can sit on the same chart. 2023 and 2024 reviews do not publish a
      matching Microsoft-as-vendor table; do not fill those years from Patch
      Tuesday or BeyondTrust counts (different counting rules).
