# Scenarios chain existing models together so a caller can type what they
# actually measured once and see every model that follows from it, instead of
# running one model, copying its mode by hand into the next one's input, and
# losing the band in the copy.
#
# A scenario never computes anything itself -- every step names a model or
# lookup that already exists and is audited on its own. `feed: {input_key:
# previous}` means "the previous step's WHOLE band feeds this input", not its
# mode; chain_evaluate() in model.py runs the fed model three times, once per
# band-end, and never collapses to a point before that. See model.py's
# `chain_evaluate()` docstring for why that is the only honest way to do it.
#
# `extra_inputs` are collected on the form but do not enter model arithmetic
# unless a step names them. Use them for "what you have today" comparisons and
# optional measurements that gate an extra step (`when_input`).
#
# `input_sections` group the form in the UI. Keys must match declared model
# inputs for steps that are not fed from a previous band.
#
# `see_also` is prose, not another step, for exactly the case it names below:
# a real connection exists (cache misses become reads) but no coefficient in
# this corpus turns one into the other, so the UI must not pretend it can.

scenarios:
  - slug: mongodb.size-to-instance
    label: MongoDB instance sizing
    default: true
    ui:
      band: hardware
      group: instance
    summary: >-
      Project collection size from vuln and optional device document counts
      (plus a residual floor), add indexes and foreign collections, compare to
      what you run today. Outputs total RAM, CPU, and gp3 disk IOPS/throughput.
    input_sections:
      - title: Project database size (collection families)
        keys:
          - baseline_vuln_count
          - baseline_storage_size
          - target_vuln_count
          - device_count
          - device_avg_storage_bytes
          - residual_storage_size
      - title: MongoDB footprint
        keys:
          - index_size
          - foreign_collections_size
          - history_copy_count
          - history_avg_storage_bytes
          - history_storage_size
      - title: Current node (optional)
        keys:
          - current_ram
          - current_vcpu
          - average_iops
          - current_disk_throughput
          - current_disk_iops
      - title: Query regime
        keys: [query_regime, fallback_reason, scan_fanout]
      - title: Concurrency and Celery
        keys:
          - concurrency
          - worker_processes
          - tickets
          - storage_latency_seconds
    extra_inputs:
      - key: current_ram
        label: Current node RAM
        unit: bytes
        required: false
        help: >-
          Optional. Compared against required host RAM in the summary.
      - key: current_vcpu
        label: Current node vCPU
        unit: vcpu
        required: false
        help: Optional. Compared against the r8i pick in the summary.
      - key: current_disk_iops
        label: Current gp3 provisioned IOPS
        unit: iops
        required: false
        help: Optional. Compared against gp3 baseline and provisioned figures.
      - key: current_disk_throughput
        label: Current gp3 provisioned throughput
        unit: MiB/s
        required: false
        help: Optional. Compared against the 125 MiB/s gp3 baseline.
      - key: average_iops
        label: Measured average IOPS (CloudWatch minute mean)
        unit: iops
        required: false
        help: >-
          Optional. CloudWatch minute mean (VolumeAvgIOPS). EBS throttles on
          the peak second, so this figure is raised by the microburst band
          (×1.5–10) to keep a burst from stalling MongoDB storage tickets.
          If omitted, gp3's included 3,000 IOPS is used as the assumed mean
          — paste a measurement to replace the guess.
      - key: query_regime
        label: Query regime
        unit: text
        required: false
        help: >-
          aggregation | fallback (planning default: fallback). Not consumed by a
          model.
      - key: fallback_reason
        label: Fallback reason
        unit: text
        required: false
        help: >-
          limit | allowlist | mixed. allowlist = query type not on the v1/v2
          aggregation allow list. Not consumed by a model.
      - key: scan_fanout
        label: Queries per task (fan-out)
        unit: count
        required: false
        help: >-
          Optional. Omit = 1 query per task; type your measured
          queries-per-task if fan-out is known. Submit an observation rather
          than treating this as a cited amplifier or a COLSCAN coefficient.
      - key: concurrency
        label: Celery worker concurrency (prefork slots)
        unit: count
        required: false
        help: >-
          worker_concurrency / celery -c. Optional. Type the slots you actually
          run; blank leaves the Celery demand steps out.
      - key: worker_processes
        label: Worker processes
        unit: count
        required: false
        help: >-
          Optional note for how many worker processes or pods share that
          concurrency. Not consumed by a model yet.
      - key: tickets
        label: Concurrent transactions permitted
        unit: tickets
        required: false
        help: >-
          On 7.0.x: serverStatus().wiredTiger.concurrentTransactions.read.totalTickets.
          On 8.0+: serverStatus().queues.execution.read.totalTickets. Supply this
          only when you actually read it for the instance you are sizing.
      - key: storage_latency_seconds
        label: Storage latency per operation, in seconds
        unit: seconds
        required: false
        help: >-
          The time an operation holds its ticket, not client round-trip latency.
          Supply both this and tickets together, or neither.
    steps:
      - kind: model
        model: mongodb.storage-from-doc-families
      - kind: model
        model: mongodb.wt-cache
        feed:
          storage_size: previous
      - kind: model
        model: mongodb.host-ram
        feed:
          cache_size: previous
      - kind: lookup
        lookup: instance_select
        # Whole aws-ec2 catalog (r8i, then cited U7i). Filtering to r8i made
        # the homepage 500 GB example report "custom sizing" on every card
        # even though r8i.96xlarge covers lo/mode and u7i-12tb covers hi.
        feed: previous
      - kind: lookup
        lookup: instance_select
        family: r6i
        feed: previous
      - kind: lookup
        lookup: instance_select
        system: azure-vm
        family: Esv6
        feed: previous
      - kind: lookup
        lookup: gp3_spec
        sum_inputs:
          - index_size
          - foreign_collections_size
        sum_model: mongodb.storage-from-doc-families
      - kind: model
        model: ebs.iops-to-provision
        defaults_from_coefficient:
          average_iops: ebs.gp3-baseline-iops
        assumed_note: >-
          not measured — peak-second IOPS still applied so a
          microburst cannot stall storage tickets
      - kind: model
        model: celery.worker-prefetch
        when_input: concurrency
      - kind: model
        model: mongodb.ticket-throughput-ceiling
        when_all_inputs:
          - tickets
          - storage_latency_seconds
      - kind: model
        model: celery.queue-amplification
        when_input: concurrency
    see_also:
      - url: https://repost.aws/knowledge-center/ebs-troubleshoot-performance-issues-ec2
        label: AWS — raise IOPS or throughput until exceeded checks stay at 0
        reason: >-
          If VolumeIOPSExceededCheck or VolumeThroughputExceededCheck is 1,
          increase provisioned IOPS (and independently, gp3 throughput) until
          the checks read 0. Instance-level exceeded checks mean a bigger
          instance, not more volume IOPS.
      - scenario: ebs.microburst
        reason: >-
          The minute mean (measured or the included 3,000) is not the number
          EBS throttles on. Peak-second IOPS is, and a throttle contends for
          MongoDB tickets. iostat -x 1 under load replaces the ×1.5–10 guess.
      - scenario: mongodb.nvd-query-concurrency
        reason: >-
          Celery demand, ticket ceilings, and the 004 drain tail are a separate
          scenario because more workers are demand, not mongod capacity.
      - scenario: celery.queue-amplification
        reason: >-
          The measured drain tail under a storage stall is a constraint model,
          not a RAM or SKU coefficient.
      - scenario: redis.celery-broker
        reason: >-
          If the backlog lives in Redis, maxmemory policy failure modes matter
          before more workers do.

  - slug: mongodb.nvd-query-concurrency
    label: NVD / relationship query concurrency
    ui:
      band: runtime
      group: mongodb
    summary: >-
      Celery in-flight demand vs MongoDB tickets and the 004 stall ceiling.
      More workers are demand, not mongod capacity. scan_fanout is a typed
      count (invite a measured L); it is not a COLSCAN coefficient.
    input_sections:
      - title: Query regime
        keys: [query_regime, fallback_reason, scan_fanout]
      - title: Celery demand
        keys: [concurrency, worker_processes]
      - title: Tickets (optional, both or neither)
        keys: [tickets, storage_latency_seconds]
    extra_inputs:
      - key: query_regime
        label: Query regime
        unit: text
        required: false
        help: >-
          aggregation | fallback (planning default: fallback). Not consumed by a
          model.
      - key: fallback_reason
        label: Fallback reason
        unit: text
        required: false
        help: >-
          limit | allowlist | mixed. allowlist = query type not on the v1/v2
          aggregation allow list. Not consumed by a model.
      - key: scan_fanout
        label: Queries per task (fan-out)
        unit: count
        required: false
        help: >-
          Optional. Omit = 1 query per task; type your measured
          queries-per-task if fan-out is known. Submit an observation rather
          than treating this as a cited amplifier or a COLSCAN coefficient.
      - key: concurrency
        label: Celery worker concurrency (prefork slots)
        unit: count
        required: false
        help: >-
          worker_concurrency / celery -c. Optional. Type the slots you actually
          run; blank leaves the Celery demand steps out.
      - key: worker_processes
        label: Worker processes
        unit: count
        required: false
        help: >-
          Optional note for how many worker processes or pods share that
          concurrency. Not consumed by a model yet.
      - key: tickets
        label: Concurrent transactions permitted
        unit: tickets
        required: false
        help: >-
          On 7.0.x: serverStatus().wiredTiger.concurrentTransactions.read.totalTickets.
          On 8.0+: serverStatus().queues.execution.read.totalTickets. Supply this
          only when you actually read it for the instance you are sizing.
      - key: storage_latency_seconds
        label: Storage latency per operation, in seconds
        unit: seconds
        required: false
        help: >-
          The time an operation holds its ticket, not client round-trip latency.
          Supply both this and tickets together, or neither.
    steps:
      - kind: model
        model: celery.worker-prefetch
        when_input: concurrency
      - kind: model
        model: mongodb.ticket-throughput-ceiling
        when_all_inputs: [tickets, storage_latency_seconds]
      - kind: model
        model: celery.queue-amplification
        when_input: concurrency
    see_also:
      - scenario: mongodb.size-to-instance
      - scenario: celery.queue-amplification
      - scenario: redis.celery-broker

  - slug: ebs.microburst
    label: My EBS volume's average IOPS
    ui:
      band: hardware
      group: storage
    summary: >-
      Raise the average IOPS your monitoring shows to what the peak second
      actually demands, which is what EBS throttles on and your dashboard has
      already averaged away.
    steps:
      - kind: model
        model: ebs.iops-to-provision
    see_also:
      - url: https://repost.aws/knowledge-center/ebs-troubleshoot-performance-issues-ec2
        label: AWS — raise IOPS or throughput until exceeded checks stay at 0
        reason: >-
          If VolumeIOPSExceededCheck or VolumeThroughputExceededCheck is 1,
          increase provisioned IOPS (and independently, gp3 throughput) until
          the checks read 0. Instance-level exceeded checks mean a bigger
          instance, not more volume IOPS.

  - slug: storage.ebs-vs-nvme-at-io-size
    label: EBS gp3 vs local NVMe at my I/O size
    ui:
      band: hardware
      group: storage
    summary: >-
      Compare effective random-read IOPS at your block size between gp3's
      provisioned ceilings and a direct-attached NVMe baseline — the comparison
      arm the corpus kept empty until issue #17.
    input_sections:
      - title: Workload shape
        keys:
          - io_size_kib
          - provisioned_iops
    steps:
      - kind: model
        model: ebs.gp3-iops-at-io-size
      - kind: model
        model: nvme-ssd.random-read-at-io-size
    see_also:
      - url: https://repost.aws/knowledge-center/ebs-troubleshoot-performance-issues-ec2
        label: AWS — raise IOPS or throughput until exceeded checks stay at 0
        reason: >-
          If the EBS card binds below the NVMe card, the gap is real — but only
          after VolumeIOPSExceededCheck / VolumeThroughputExceededCheck say you
          are actually hitting a volume limit rather than an instance pipe.

  - slug: clickhouse.parts-insert-ceiling
    label: ClickHouse insert part-count ceiling
    ui:
      band: hardware
      group: database
      sub: clickhouse
    summary: >-
      At how many active parts per partition ClickHouse rejects inserts — and
      the 10× default jump at 23.6 that makes an unversioned answer wrong.
    steps:
      - kind: model
        model: clickhouse.parts-insert-ceiling

  - slug: redis.celery-broker
    label: Redis as a Celery broker
    ui:
      band: runtime
      group: redis
    summary: >-
      How much Redis maxmemory, and how many workers, before Celery loses tasks
      or cannot drain. Investigation 005 measured both policies Celery documents:
      noeviction stalls workers and loses the batch; allkeys-lru keeps workers
      busy while dropping ~two-thirds. Neither is a safe point — alert on
      used_memory/maxmemory before either mode. Drain and completion-ceiling
      terms are investigation 004's; prefetch reservation is the documented
      worker formula, not a drain prediction.
    input_sections:
      - title: Worker fleet (optional)
        keys:
          - concurrency
    steps:
      - kind: model
        model: celery.redis-broker-maxmemory
      - kind: model
        model: celery.queue-amplification
      - kind: model
        model: celery.worker-prefetch
    see_also:
      - scenario: celery.queue-amplification
        reason: >-
          Backlog growth above the completion ceiling and drain time while the
          disk stays bad are the 004 model on its own. This scenario puts those
          next to the maxmemory failure modes rather than replacing them.
      - url: https://docs.celeryq.dev/en/v5.4.0/getting-started/backends-and-brokers/redis.html
        label: Celery 5.4.0 — Using Redis (documents noeviction and allkeys-lru)
        reason: >-
          The page that presents both policies as valid. The scenario's first
          step is the measured conflict with that wording, not a policy pick.
  - slug: celery.queue-amplification
    label: Celery queue under a storage stall
    ui:
      band: runtime
      group: celery
    summary: >-
      How much worse recovery gets when MongoDB is I/O-starved and Celery keeps
      accepting work — measured backlog, completion ceiling, and drain time from
      investigation 004.
    steps:
      - kind: model
        model: celery.queue-amplification
    see_also:
      - scenario: redis.celery-broker
        reason: >-
          When that unbounded backlog fills Redis, both documented maxmemory
          policies fail — stall versus silent loss. The Redis/Celery scenario
          names the failure mode and the occupancy to alert on.
