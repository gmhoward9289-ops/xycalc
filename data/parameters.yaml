# The vocabulary. Every coefficient, observation and model output is an
# instance of one of these, so two figures sharing a parameter are always
# comparable — and two figures that look comparable but are not (dataSize vs
# storageSize) are forced apart into different parameters.

parameters:
  # -- MongoDB storage --------------------------------------------------
  - slug: storage.collection_bytes_on_disk
    label: Collection bytes on disk (compressed)
    unit: bytes
    dimension: bytes
    notes: >-
      db.stats().storageSize. Compressed, and includes free space inside
      allocated extents. Deliberately a different parameter from the
      uncompressed size — conflating the two is the single most common
      MongoDB sizing error and this corpus makes it a type error.

  - slug: storage.collection_bytes_uncompressed
    label: Collection bytes uncompressed
    unit: bytes
    dimension: bytes
    notes: >-
      db.stats().dataSize. This is what actually occupies the WiredTiger
      cache, because cached collection data is uncompressed.

  - slug: storage.index_bytes_on_disk
    label: Index bytes on disk
    unit: bytes
    dimension: bytes
    notes: >-
      db.stats().indexSize. Treated as roughly the in-cache size too, because
      index prefix compression survives into the cache while collection block
      compression does not.

  - slug: vuln.count
    label: Vulnerability record count
    unit: count
    dimension: count
    notes: >-
      Count of vulnerability records stored — may track NVD CVEs, enriched
      documents, or a subset depending on the deployment.

  - slug: vuln.yoy_growth_pct
    label: Year-over-year vulnerability publication growth
    unit: percent
    dimension: percent

  - slug: storage.compression_ratio
    label: Block compression ratio (uncompressed ÷ compressed)
    unit: ratio
    dimension: ratio

  # -- WiredTiger cache -------------------------------------------------
  - slug: cache.size_bytes
    label: WiredTiger cache size
    unit: bytes
    dimension: bytes

  - slug: cache.eviction_target_pct
    label: Eviction target (% of cache)
    unit: percent
    dimension: percent
    notes: >-
      The level WiredTiger works to keep total cache usage at. The practical
      consequence: usable cache is a fraction of configured cache, so
      "contents fit in N bytes" and "configure N bytes" are different claims.

  - slug: cache.eviction_trigger_pct
    label: Eviction trigger (% of cache)
    unit: percent
    dimension: percent
    notes: >-
      Where application threads are pulled into doing eviction work. Crossing
      it does not fail; it converts a memory problem into a latency problem,
      which is why it shows up in traces long before it shows up in an alarm.

  - slug: cache.eviction_dirty_target_pct
    label: Dirty eviction target (% of cache)
    unit: percent
    dimension: percent

  - slug: cache.eviction_dirty_trigger_pct
    label: Dirty eviction trigger (% of cache)
    unit: percent
    dimension: percent
    notes: >-
      Write-heavy workloads hit this long before they fill the cache. A cache
      sized purely on total bytes can still throttle at 20% occupancy if all
      of it is dirty.

  # -- host -------------------------------------------------------------
  - slug: host.ram_bytes
    label: Host RAM
    unit: bytes
    dimension: bytes

  - slug: host.cache_default_share_pct
    label: Default cache share of (RAM − reserve)
    unit: percent
    dimension: percent

  - slug: host.default_reserve_bytes
    label: RAM held back before the default cache split
    unit: bytes
    dimension: bytes

  # -- block storage ------------------------------------------------------
  - slug: io.iops
    label: I/O operations per second
    unit: iops
    dimension: iops
    notes: >-
      Volume-side operations, which are not application-side operations. EBS
      caps SSD I/O at 256 KiB and merges small sequential writes, so one number
      can be several times the other in either direction.

  - slug: io.peak_to_mean_ratio
    label: Peak-second to mean-minute IOPS ratio
    unit: ratio
    dimension: ratio
    notes: >-
      The microburst factor, and the least measurable number in this corpus.
      CloudWatch publishes minute averages; this is the thing those averages
      remove. It cannot be recovered from them at any resolution.

  - slug: io.max_io_size_kib
    label: Maximum I/O size counted as one operation
    unit: KiB
    dimension: bytes

  - slug: io.throughput_mibps
    label: Volume throughput
    unit: MiB/s
    dimension: bytes_per_second

  - slug: io.queue_depth
    label: Average queue depth
    unit: count
    dimension: count

  - slug: io.iops_per_gib
    label: Provisionable IOPS per GiB of volume
    unit: iops per GiB
    dimension: ratio

  - slug: io.check_resolution_seconds
    label: Finest burst a metric can resolve
    unit: seconds
    dimension: seconds

  # -- concurrency and queueing ------------------------------------------
  - slug: db.concurrency_tickets
    label: Concurrent storage-engine transactions permitted
    unit: tickets
    dimension: count
    notes: >-
      MongoDB's admission control. Not a lock and not a connection limit: it
      caps how many operations may be inside the storage engine at once. It is
      the term that converts a latency problem into a throughput ceiling.

  - slug: db.ops_per_second
    label: Sustainable operation rate
    unit: ops/s
    dimension: iops
    notes: >-
      The ceiling implied by Little's law: concurrency ÷ latency. Arrivals above
      it do not degrade throughput gracefully — they queue, and the queue does
      not drain.

  - slug: db.storage_latency_seconds
    label: Storage latency per operation
    unit: seconds
    dimension: seconds

  # -- AWS EC2 instance catalog -------------------------------------------
  - slug: instance.vcpu_count
    label: vCPU count
    unit: vcpu
    dimension: count
    notes: >-
      Carried alongside host.ram_bytes for context in `instance-select`
      output. Not used to choose an instance — r8i pricing is confirmed flat
      per GB of RAM across the whole family, so RAM alone determines the
      smallest instance that fits a given requirement. vCPU is informational,
      not a selection criterion, unless a future model adds a CPU-bound
      sizing question.

  - slug: instance.ebs_bandwidth_gbps
    label: Maximum EBS bandwidth
    unit: Gbps
    dimension: bytes_per_second
    notes: >-
      The instance's own EBS pipe, separate from a gp3 volume's 80,000 IOPS /
      2,000 MiB/s catalog ceiling. A volume provisioned to the catalog max is
      still throttled if this number is smaller — InstanceEBSIOPSExceededCheck
      / the EBS bandwidth column on the instance-types page, not the volume.

  - slug: vuln.compound_growth_multiplier
    label: Compound CVE-count growth multiplier
    unit: ratio
    dimension: ratio
    notes: >-
      (1 + YoY growth/100)^years — precomputed bands for multi-year storage
      projection when the model engine cannot exponentiate in one step.
