# The vocabulary. Every coefficient, observation and model output is an
# instance of one of these, so two figures sharing a parameter are always
# comparable — and two figures that look comparable but are not (dataSize vs
# storageSize) are forced apart into different parameters.

parameters:
  # -- MongoDB storage --------------------------------------------------
  - slug: storage.collection_bytes_on_disk
    label: Collection bytes on disk (compressed)
    unit: bytes
    dimension: bytes
    notes: >-
      db.stats().storageSize. Compressed, and includes free space inside
      allocated extents. Deliberately a different parameter from the
      uncompressed size — conflating the two is the single most common
      MongoDB sizing error and this corpus makes it a type error.

  - slug: storage.collection_bytes_uncompressed
    label: Collection bytes uncompressed
    unit: bytes
    dimension: bytes
    notes: >-
      db.stats().dataSize. This is what actually occupies the WiredTiger
      cache, because cached collection data is uncompressed.

  - slug: storage.index_bytes_on_disk
    label: Index bytes on disk
    unit: bytes
    dimension: bytes
    notes: >-
      db.stats().indexSize. Treated as roughly the in-cache size too, because
      index prefix compression survives into the cache while collection block
      compression does not.

  - slug: vuln.count
    label: Vulnerability record count
    unit: count
    dimension: count
    notes: >-
      Count of vulnerability records stored — may track NVD CVEs, enriched
      documents, or a subset depending on the deployment.

  - slug: device.count
    label: Device document count
    unit: count
    dimension: count
    notes: >-
      Count of device (or asset) documents in the device collection family.
      Paired with measured on-disk bytes-per for storage.from-doc-families.

  - slug: device.avg_storage_bytes
    label: Average on-disk bytes per device document
    unit: bytes
    dimension: bytes
    notes: >-
      storageSize ÷ count for the device family (compressed). Not BSON
      avgObjSize.

  - slug: storage.residual_bytes
    label: Residual collection storage (non-projected families)
    unit: bytes
    dimension: bytes
    notes: >-
      On-disk collection bytes not covered by the vuln or device family
      projections. Flat floor in storage-from-doc-families.

  - slug: vuln.yoy_growth_pct
    label: Year-over-year vulnerability publication growth
    unit: percent
    dimension: percent

  - slug: storage.compression_ratio
    label: Block compression ratio (uncompressed ÷ compressed)
    unit: ratio
    dimension: ratio

  - slug: storage.self_compression_proxy_ratio
    label: Gzip self-compression proxy (raw ÷ gzip-9)
    unit: ratio
    dimension: ratio
    notes: >-
      A property of the raw document bytes that an operator can measure with
      mongoexport + gzip -9, without WiredTiger internals. Used as the x-axis
      for the manufactured compression-shape curve (investigation 010 / T2).

  - slug: storage.covered_query_residency_ratio
    label: Covered-query residency / indexSize ratio
    unit: ratio
    dimension: ratio
    notes: >-
      WiredTiger bytes brought into cache by an index-covered query path,
      divided by db.stats().indexSize for the indexes that path touched.
      Investigation 005 / T5: values near 1.0 support treating in-cache index
      bytes as ≈ indexSize; values well above 1.0 would imply an expansion
      term (see plan issue-13).

  # -- WiredTiger cache -------------------------------------------------
  - slug: cache.size_bytes
    label: WiredTiger cache size
    unit: bytes
    dimension: bytes

  - slug: cache.eviction_target_pct
    label: Eviction target (% of cache)
    unit: percent
    dimension: percent
    notes: >-
      The level WiredTiger works to keep total cache usage at. The practical
      consequence: usable cache is a fraction of configured cache, so
      "contents fit in N bytes" and "configure N bytes" are different claims.

  - slug: cache.eviction_trigger_pct
    label: Eviction trigger (% of cache)
    unit: percent
    dimension: percent
    notes: >-
      Where application threads are pulled into doing eviction work. Crossing
      it does not fail; it converts a memory problem into a latency problem,
      which is why it shows up in traces long before it shows up in an alarm.

  - slug: cache.eviction_dirty_target_pct
    label: Dirty eviction target (% of cache)
    unit: percent
    dimension: percent

  - slug: cache.eviction_dirty_trigger_pct
    label: Dirty eviction trigger (% of cache)
    unit: percent
    dimension: percent
    notes: >-
      Write-heavy workloads hit this long before they fill the cache. A cache
      sized purely on total bytes can still throttle at 20% occupancy if all
      of it is dirty. Distinct from cache.tracked_dirty_pct_peak (observed).

  - slug: cache.tracked_dirty_pct_peak
    label: Peak tracked dirty bytes (% of cache)
    unit: percent
    dimension: percent
    notes: >-
      Max of wiredTiger.cache["tracked dirty bytes in the cache"] /
      maximum bytes configured over a probe window (investigation 014 / T3).

  - slug: cache.pages_read_per_op
    label: Pages read into cache per operation
    unit: pages/op
    dimension: ratio
    notes: >-
      From WiredTiger serverStatus under a point-lookup probe: pages read into
      cache divided by operations. Near zero means the working set is resident;
      rising with oversubscription means each lookup pays for more device I/O.

  - slug: storage.checkpoint_interval_seconds
    label: WiredTiger checkpoint interval
    unit: seconds
    dimension: seconds
    notes: >-
      MongoDB storage.syncPeriodSecs / --syncdelay default. How often mongod
      asks WiredTiger to write a durable checkpoint.

  - slug: cache.size_gb
    label: WiredTiger cache size as configured (GB)
    unit: GB
    dimension: bytes
    notes: >-
      The --wiredTigerCacheSizeGB figure, decimal GB as mongod takes it.
      Distinct from cache.size_bytes so a probe's 0.25 GB setting is not
      silently rewritten as 268435456.

  - slug: cache.oversubscription_ratio
    label: dataSize divided by configured cache
    unit: ratio
    dimension: ratio
    notes: >-
      dataSize / wiredTigerCacheSize. 1.0 is "cache equals uncompressed data",
      which is not the same as cache-resident under uniform point lookups.

  - slug: cache.oversub_loglog_slope
    label: Log-log slope of ops/s vs oversubscription
    unit: ratio
    dimension: ratio
    notes: >-
      Δ log(ops/s) / Δ log(dataSize/maxCache) between two adjacent probe
      legs. Negative means throughput falls as the working set outgrows
      the cache.

  # -- host -------------------------------------------------------------
  - slug: host.ram_bytes
    label: Host RAM
    unit: bytes
    dimension: bytes

  - slug: host.cache_default_share_pct
    label: Default cache share of (RAM − reserve)
    unit: percent
    dimension: percent

  - slug: host.default_reserve_bytes
    label: RAM held back before the default cache split
    unit: bytes
    dimension: bytes

  - slug: host.container_rss_bytes
    label: Container RSS (docker stats MemUsage)
    unit: bytes
    dimension: bytes
    notes: >-
      What a container's memory controller counts against it, per `docker
      stats` — total process RSS, not any single subsystem's configured
      budget. For MongoDB this is WiredTiger cache contents PLUS connection
      buffers, driver overhead and everything else mongod holds — deliberately
      a different parameter from cache.size_bytes, which mongodb.wt-cache
      predicts. Comparing this against that model's output would be exactly
      the "wrong quantity" mistake docs/telemetry warns about; this parameter
      exists for the colocation-footprint question, not for validating
      wt-cache.

  - slug: host.capacity_buffer_pct
    label: Capacity buffer for future growth (%)
    unit: percent
    dimension: percent
    notes: >-
      A caller-supplied planning margin, not a MongoDB or AWS fact — the
      compounded effect of expected database growth over a planning horizon,
      e.g. (1 + annual_growth)^years - 1. Deliberately an input rather than a
      coefficient: xycalc has no basis to assert anyone's growth rate, only to
      apply whichever one the caller supplies.

  # -- block storage ------------------------------------------------------
  - slug: io.iops
    label: I/O operations per second
    unit: iops
    dimension: iops
    notes: >-
      Volume-side operations, which are not application-side operations. EBS
      caps SSD I/O at 256 KiB and merges small sequential writes, so one number
      can be several times the other in either direction.

  - slug: io.peak_to_mean_ratio
    label: Peak-second to mean-minute IOPS ratio
    unit: ratio
    dimension: ratio
    notes: >-
      The microburst factor, and the least measurable number in this corpus.
      CloudWatch publishes minute averages; this is the thing those averages
      remove. It cannot be recovered from them at any resolution.

  - slug: io.max_io_size_kib
    label: Maximum I/O size counted as one operation
    unit: KiB
    dimension: bytes

  - slug: io.io_size_crossover_kib
    label: I/O size where throughput binds before IOPS
    unit: KiB
    dimension: bytes
    notes: >-
      At block sizes above this, a device is limited by MiB/s rather than
      operations per second. Derived from min(iops_ceiling, throughput_mibps ×
      1024 ÷ io_size_kib) — distinct from io.max_io_size_kib, which is a hard
      cap on operation size, not where the two ceilings cross.

  - slug: io.throughput_mibps
    label: Volume throughput
    unit: MiB/s
    dimension: bytes_per_second

  - slug: io.throughput_mbps
    label: Volume throughput (decimal MB/s)
    unit: MB/s
    dimension: bytes_per_second
    notes: >-
      Decimal MB/s (10^6 B/s), the unit Azure specifies managed disks in —
      deliberately a different parameter from io.throughput_mibps, which is
      binary MiB/s (2^20 B/s). The two differ by ~4.9%, small enough to look
      like rounding and large enough to matter across a provider boundary, so
      the corpus keeps them apart the way it keeps dataSize and storageSize
      apart rather than silently converting one into the other.

  - slug: io.throughput_per_iops_mbps
    label: Throughput unlocked per provisioned IOPS
    unit: MB/s per IOPS
    dimension: ratio
    notes: >-
      Azure Premium SSD v2 gates throughput on IOPS: each provisioned IOPS
      raises the settable throughput ceiling by this many decimal MB/s. It is
      why a throughput target is really an IOPS floor — you cannot buy MB/s
      past the free baseline without buying the IOPS that unlock them.

  - slug: io.queue_depth
    label: Average queue depth
    unit: count
    dimension: count

  - slug: io.iops_per_gib
    label: Provisionable IOPS per GiB of volume
    unit: iops per GiB
    dimension: ratio

  - slug: io.check_resolution_seconds
    label: Finest burst a metric can resolve
    unit: seconds
    dimension: seconds

  # -- concurrency and queueing ------------------------------------------
  - slug: db.concurrency_tickets
    label: Concurrent storage-engine transactions permitted
    unit: tickets
    dimension: count
    notes: >-
      MongoDB's admission control. Not a lock and not a connection limit: it
      caps how many operations may be inside the storage engine at once. It is
      the term that converts a latency problem into a throughput ceiling.

  - slug: db.ops_per_second
    label: Sustainable operation rate
    unit: ops/s
    dimension: iops
    notes: >-
      The ceiling implied by Little's law: concurrency ÷ latency. Arrivals above
      it do not degrade throughput gracefully — they queue, and the queue does
      not drain.

  - slug: db.storage_latency_seconds
    label: Storage latency per operation
    unit: seconds
    dimension: seconds

  - slug: storage.checkpoint_p99_latency_ratio
    label: p99 latency during checkpoint ÷ outside checkpoint
    unit: ratio
    dimension: ratio
    notes: >-
      ticket_probe timeseries: p99 latency in checkpoint-running seconds
      divided by p99 outside those seconds. A ratio near 1 does not
      falsify a short-window mean; it is a lab check, not a portable
      sawtooth coefficient.

  - slug: db.mean_latency_ms
    label: Mean client-observed operation latency
    unit: ms
    dimension: seconds
    notes: >-
      Mean latency reported by the probe client (pymongo), not WiredTiger
      hold time. Distinct from db.storage_latency_seconds: this is what
      the caller waited, including admission-queue time.

  # -- Celery / Redis broker ---------------------------------------------
  - slug: queue.prefetch_reserved_tasks
    label: Tasks reserved off-queue per worker (prefetch × concurrency)
    unit: tasks
    dimension: count

  - slug: worker.prefetch_multiplier
    label: Worker prefetch multiplier
    unit: count
    dimension: count

  - slug: worker.task_acks_late
    label: Acknowledge tasks after execution (0/1)
    unit: count
    dimension: count

  - slug: broker.visibility_timeout_seconds
    label: Broker visibility timeout
    unit: seconds
    dimension: seconds

  - slug: queue.completion_rate_ceiling_ops_s
    label: Fleet completion rate ceiling under stall
    unit: ops/s
    dimension: iops

  - slug: queue.backlog_depth_max
    label: Peak broker queue depth during load
    unit: tasks
    dimension: count

  - slug: queue.depth_understatement_max
    label: Peak (outstanding − broker queue depth) during load
    unit: tasks
    dimension: count

  - slug: queue.drain_seconds
    label: Seconds to drain backlog after arrivals stop
    unit: seconds
    dimension: seconds

  - slug: queue.outstanding_understatement
    label: Outstanding tasks invisible to broker LLEN (outstanding − depth)
    unit: tasks
    dimension: count
    notes: >-
      True outstanding (enqueued − completed) minus Redis LIST depth. Dominated
      by prefetch × concurrency reservation under overload when the fleet is
      fed; see investigation 014 / T6.

  - slug: queue.duplicate_rate_pct
    label: Broker redelivery duplicate execution rate
    unit: percent
    dimension: percent

  - slug: server.maxmemory_bytes
    label: Redis maxmemory ceiling (0 = unlimited)
    unit: bytes
    dimension: bytes

  - slug: server.maxmemory_policy_default
    label: Shipped default maxmemory-policy encoding
    unit: count
    dimension: count

  - slug: broker.documented_maxmemory_policy_count
    label: Celery-documented maxmemory-policy options
    unit: count
    dimension: count

  - slug: broker.noeviction_producer_error_rate
    label: send_task failure rate at broker maxmemory
    unit: ratio
    dimension: percent

  - slug: broker.noeviction_worker_starts
    label: Worker consumes while broker at maxmemory (0/1)
    unit: count
    dimension: count

  - slug: broker.allkeys_lru_task_loss_rate
    label: Task loss rate under broker memory pressure
    unit: ratio
    dimension: percent

  - slug: broker.duplicate_execution_rate
    label: Duplicate task execution rate under broker pressure
    unit: ratio
    dimension: percent

  - slug: broker.noeviction_oom_stall_reported
    label: Practitioner report of noeviction OOM queue stall (0/1)
    unit: count
    dimension: count

  - slug: broker.evicted_keys_delta
    label: Evicted keys delta over evict_probe run
    unit: count
    dimension: count

  - slug: memory.empty_key_overhead_bytes
    label: Empty string key MEMORY USAGE overhead
    unit: bytes
    dimension: bytes
    notes: >-
      Vendor MEMORY USAGE of SET "" "" — administrative overhead for a key with
      empty name and empty value. Floor for key metadata, not per-list-element
      Celery task message size.

  - slug: server.maxmemory_samples
    label: Keys sampled per approximated LRU/LFU eviction
    unit: count
    dimension: count

  - slug: server.list_max_listpack_size
    label: Quicklist listpack node size directive
    unit: count
    dimension: count
    notes: >-
      redis.conf list-max-listpack-size. Negative values encode KB caps
      (-2 = 8 KB). Positive values are exact element counts per node.

  - slug: broker.volatile_no_ttl_equals_noeviction
    label: Volatile eviction with no TTLs equals noeviction (0/1)
    unit: count
    dimension: count

  - slug: server.noeviction_reads_still_work
    label: noeviction still serves read-only commands (0/1)
    unit: count
    dimension: count

  - slug: memory.small_aggregate_avg_saving_factor
    label: Average memory saving from special aggregate encoding
    unit: ratio
    dimension: ratio

  - slug: server.hash_max_listpack_entries
    label: Max hash fields before listpack converts to hashtable
    unit: count
    dimension: count

  - slug: host.maxmemory_free_ram_headroom_pct
    label: Free host RAM beyond maxmemory (vendor rule of thumb)
    unit: percent
    dimension: percent

  # -- MongoDB GridFS / BSON / PyMongo / schema refs ----------------------
  - slug: storage.bson_max_document_bytes
    label: Maximum BSON document size
    unit: bytes
    dimension: bytes
    notes: >-
      Hard server limit on a single document. Below this, BinData in one
      document can replace GridFS; at or above it, GridFS (or external object
      storage) is required.

  - slug: storage.gridfs_chunk_size_bytes
    label: GridFS default chunk size
    unit: bytes
    dimension: bytes
    notes: >-
      Default size of each fs.chunks.data payload except the last chunk.
      Chunk count for a file is ceil(length / chunkSize); last chunk is
      shorter. Does not include BSON field overhead around the Binary.

  - slug: storage.gridfs_mmapv1_padding_slot_bytes
    label: Historical MMAPv1 padding slot GridFS chunk docs targeted
    unit: bytes
    dimension: bytes
    notes: >-
      Spec rationale only: 255 KiB of chunk data aimed to keep the whole chunk
      document inside a 256 KiB MMAPv1 allocation. WiredTiger does not use
      that padding model; retained so the 255-not-256 choice stays citable.

  - slug: storage.objectid_bytes
    label: BSON ObjectId size
    unit: bytes
    dimension: bytes
    notes: >-
      Payload size of an ObjectId value — floor for a manual foreign-key field
      that stores another document's _id. Field name and BSON type tag add
      more; this is the identifier alone.

  - slug: schema.prefer_manual_refs_over_dbref
    label: Vendor prefers manual refs over DBRefs (0/1)
    unit: count
    dimension: count
    notes: >-
      Encoded 1 = MongoDB documents say use manual references unless you have
      a compelling reason for DBRefs. Not a sizing multiplier — a documented
      preference that still leaves $lookup cost unquantified.

  - slug: driver.max_pool_size
    label: Driver maxPoolSize default
    unit: connections
    dimension: count
    notes: >-
      Maximum concurrent connections a single MongoClient pool maintains.
      Client-side; multiplies by process count for server connection demand.

  - slug: driver.min_pool_size
    label: Driver minPoolSize default
    unit: connections
    dimension: count

  - slug: driver.max_connecting
    label: Driver maxConnecting default
    unit: connections
    dimension: count
    notes: >-
      Concurrent connection establishments per pool. Low defaults throttle
      connection storms; raising speeds checkout under cold start.

  - slug: driver.connect_timeout_ms
    label: Driver connectTimeoutMS default
    unit: milliseconds
    dimension: seconds

  - slug: host.cache_size_pct_ceiling
    label: Max wiredTigerCacheSizePct of available memory
    unit: percent
    dimension: percent
    notes: >-
      MongoDB 8.2+ percentage cache knob ceiling. Distinct from the default
      50%-of-(RAM-1GB) formula — this is the hard upper bound when using
      cacheSizePct for vertical growth.

  # -- AWS EC2 instance catalog -------------------------------------------
  - slug: instance.vcpu_count
    label: vCPU count
    unit: vcpu
    dimension: count
    notes: >-
      Carried alongside host.ram_bytes for context in `instance-select`
      output. Not used to choose an instance — r8i pricing is confirmed flat
      per GB of RAM across the whole family, so RAM alone determines the
      smallest instance that fits a given requirement. vCPU is informational,
      not a selection criterion, unless a future model adds a CPU-bound
      sizing question.

  - slug: instance.ebs_bandwidth_gbps
    label: Maximum EBS bandwidth
    unit: Gbps
    dimension: bytes_per_second
    notes: >-
      The instance's own EBS pipe, separate from a gp3 volume's 80,000 IOPS /
      2,000 MiB/s catalog ceiling. A volume provisioned to the catalog max is
      still throttled if this number is smaller — InstanceEBSIOPSExceededCheck
      / the EBS bandwidth column on the instance-types page, not the volume.

  - slug: vuln.compound_growth_multiplier
    label: Compound CVE-count growth multiplier
    unit: ratio
    dimension: ratio
    notes: >-
      (1 + YoY growth/100)^years — precomputed bands for multi-year storage
      projection when the model engine cannot exponentiate in one step.

  # -- ClickHouse MergeTree insert backpressure ---------------------------
  - slug: clickhouse.active_parts_delay_threshold
    label: Active parts per partition before insert delay
    unit: count
    dimension: count
    notes: >-
      MergeTree setting parts_to_delay_insert. When active parts in a single
      partition reach this count, INSERTs are artificially slowed so merges can
      catch up. Defaults jumped from 150 to 1000 at ClickHouse 23.6.

  - slug: clickhouse.active_parts_throw_threshold
    label: Active parts per partition before insert reject
    unit: count
    dimension: count
    notes: >-
      MergeTree setting parts_to_throw_insert. Above this active-part count in
      one partition, INSERT raises "Too many parts". Defaults jumped from 300
      to 3000 at ClickHouse 23.6.

  - slug: clickhouse.max_insert_delay_seconds
    label: Max artificial INSERT delay under part pressure
    unit: seconds
    dimension: seconds
    notes: >-
      MergeTree setting max_delay_to_insert — upper bound on how long ClickHouse
      will sleep an INSERT when parts_to_delay_insert has been crossed.

  - slug: clickhouse.max_avg_part_size_for_too_many_parts_bytes
    label: Avg part size above which too-many-parts checks are skipped
    unit: bytes
    dimension: bytes
    notes: >-
      MergeTree setting max_avg_part_size_for_too_many_parts. When the average
      active part in a partition is larger than this, parts_to_delay_insert and
      parts_to_throw_insert do not delay or reject — ClickHouse's own escape
      hatch for tables whose parts have already merged large (TB-scale tables
      with healthy merges). The insert-frequency failure mode is about many
      small parts, not about total table bytes.

  - slug: clickhouse.peak_active_parts
    label: Peak active MergeTree parts during probe
    unit: count
    dimension: count
    notes: >-
      Observed peak of system.parts (active) in a probe window. Hardware-
      and merge-regime scoped. Not an inserts/sec floor.
