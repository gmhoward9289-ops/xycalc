  - slug: obs-mongodb-colocation-probe-reef-2026-08-19
    title: "colocation_probe: Mongo+Redis+ClickHouse+Celery, three-phase RSS"
    publisher: xycalc project (benchmark harness, committed)
    url:
    version: tools/bench/colocation_probe (harness), results.json
    retrieved_on: '2026-08-19'
    source_type: benchmark
    notes: >-
      Harness: tools/bench/colocation_probe/ (compose.yml, clickhouse_load.sql,
      sample.py, run.sh), full docker-stats output in that directory's
      results.json. Docker Desktop 29.7.2 / Compose v5.4.0 on reef (Ryzen,
      64 GB RAM, Windows 11, WSL2 VM capped at 31.3 GiB). Mongo container:
      --wiredTigerCacheSizeGB 1, mem_limit 2g. 200,000-document synthetic
      events collection (dataSize 145 MB) loaded via celery_probe's own
      drive.py load(). ClickHouse: 3,000,000-row generated table via
      clickhouse_load.sql. Redis and the Celery worker left on documented
      defaults throughout.

      The "under load" phase deliberately did NOT use celery_probe's driver —
      that script correctly refuses to run below 2x cache oversubscription
      (145 MB dataSize vs 1 GB cache = 0.1x), a guard built for investigation
      003's storage-stall question, not this one. Substituted instead: 50,000
      concurrent mongosh point lookups by account_id plus one ClickHouse
      GROUP BY scan, run for roughly 2-4 seconds while docker stats sampled.
      mongo's CPU% (119.56%) during that sample confirms real concurrent
      work, not an idle read.

      Small-scale by design -- this measures per-service RSS *shape* across
      idle/loaded/under-load, not a production-scale colocation footprint.
      n=1, one host, one run. See results.json in the same directory for the
      full docker-stats output at each phase. Scaled follow-up: investigation
      009 / obs-mongodb-colocation-share-aws-2026-08-21.

