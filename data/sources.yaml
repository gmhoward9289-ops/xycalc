# Every coefficient in this corpus traces to one of these.
# The build refuses to insert a number whose source slug is missing.

sources:
  - slug: mongodb-manual-wiredtiger
    title: WiredTiger Storage Engine
    publisher: MongoDB, Inc.
    url: https://www.mongodb.com/docs/manual/core/wiredtiger/
    version: MongoDB 8.3 manual (Current)
    retrieved_on: '2026-07-31'
    source_type: vendor_doc
    notes: >-
      The load-bearing page for cache sizing, and the one that settles the
      question people get wrong most often: the WiredTiger cache holds
      UNCOMPRESSED collection data, while the filesystem cache holds the
      on-disk format WITH its compression. Those two sentences are why a
      500 GB database does not need a 500 GB cache and why it also cannot
      be served by one.

      Also carries the default formula and, notably, the advice not to raise
      it. Read alongside the diagnostics FAQ, which says the same thing more
      bluntly.

  - slug: mongodb-manual-dbstats
    title: 'dbStats (database command reference)'
    publisher: MongoDB, Inc.
    url: https://www.mongodb.com/docs/manual/reference/command/dbStats/
    version: MongoDB 8.3 manual (Current)
    retrieved_on: '2026-07-31'
    source_type: vendor_doc
    notes: >-
      Defines the three numbers everyone quotes at each other without agreeing
      on what they mean. dataSize is uncompressed; storageSize is what the
      collections occupy on disk and "may be smaller than dataSize ... with
      compression enabled"; indexSize is disk space allocated to indexes.

      The documentation does NOT state whether indexSize is compressed, which
      is why this corpus treats in-cache index bytes as roughly equal to
      indexSize rather than applying an expansion factor. See the WiredTiger
      page: index prefix compression survives into the cache, which collection
      block compression does not.

  - slug: mongodb-faq-diagnostics
    title: 'FAQ: MongoDB Diagnostics'
    publisher: MongoDB, Inc.
    url: https://www.mongodb.com/docs/manual/faq/diagnostics/
    version: MongoDB 8.3 manual (Current)
    retrieved_on: '2026-07-31'
    source_type: vendor_doc
    notes: >-
      Answers "Must my working set size fit RAM?" with one word: "No." And
      states outright: "Avoid increasing the WiredTiger internal cache size
      above its default value."

      Carried because it contradicts the premise of the question this corpus
      was started to answer. A vendor telling you not to do the thing you are
      sizing for is evidence, not an obstacle, and the model reports it as a
      constraint rather than burying it.

  - slug: wiredtiger-tune-cache-mongodb-6.0
    title: 'WiredTiger: Cache and eviction tuning'
    publisher: MongoDB, Inc. (WiredTiger project documentation)
    url: https://source.wiredtiger.com/mongodb-6.0/tune_cache.html
    version: WiredTiger as shipped in MongoDB 6.0
    retrieved_on: '2026-07-31'
    source_type: vendor_doc
    notes: >-
      The eviction thresholds, from the storage engine's own documentation
      rather than from MongoDB's. These are the numbers that make configured
      cache size and usable cache size different quantities: WiredTiger works
      to keep the cache at 80% full, and pulls application threads into
      eviction work at 95%.

      Version-pinned deliberately. This page exists per MongoDB release
      because the defaults are not guaranteed stable across them, which is
      exactly why every coefficient in this corpus must name what it applies
      to.

  - slug: percona-mongodb-compression-snappy-zstd
    title: 'Compression Methods in MongoDB: Snappy vs. Zstd'
    publisher: Percona
    url: https://www.percona.com/blog/compression-methods-in-mongodb-snappy-vs-zstd/
    retrieved_on: '2026-07-31'
    source_type: practitioner
    notes: >-
      Compression ratios are workload-dependent to a degree that makes any
      single figure misleading — the ratios published here are measured on
      one dataset, and log-shaped data compresses far better than data that
      is mostly numbers and ObjectIds.

      Which is why the ratio coefficients in this corpus carry wide bands and
      grade `practitioner`, not `documented`. If you can run db.stats() on the
      real database, use its dataSize and skip the ratio entirely: a measured
      number beats a cited range from someone else's data.

  - slug: aws-ebs-io-characteristics
    title: Amazon EBS I/O characteristics and monitoring
    publisher: Amazon Web Services
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-io-characteristics.html
    version: EBS User Guide, retrieved 2026-07-31
    retrieved_on: '2026-07-31'
    source_type: vendor_doc
    notes: >-
      Settles the question docs/telemetry/ebs.md was left holding. The
      exceeded-checks fire when driven IOPS "for any second within the minute"
      consistently exceeds provisioned performance — so the metric's resolution
      is ONE SECOND, not one minute. A burst shorter than a second is invisible
      to CloudWatch entirely, and needs the NVMe detailed performance
      statistics.

      Also carries the two accounting rules that make measured IOPS and
      provisioned IOPS different quantities: SSD I/O is capped at 256 KiB per
      operation, so one large write counts as several, while small sequential
      writes are merged and count as one. An application's operation count is
      not the volume's.

  - slug: aws-repost-ebs-troubleshoot-performance
    title: How do I troubleshoot Amazon EBS performance issues with my Amazon EC2 instance?
    publisher: Amazon Web Services
    url: https://repost.aws/knowledge-center/ebs-troubleshoot-performance-issues-ec2
    retrieved_on: '2026-08-20'
    source_type: vendor_doc
    notes: >-
      The operational loop this corpus's IOPS band is a guess at: if
      VolumeIOPSExceededCheck or VolumeThroughputExceededCheck is 1, increase
      provisioned IOPS (and independently, gp3 throughput) until the checks
      read 0. InstanceEBSIOPSExceededCheck / InstanceEBSThroughputExceededCheck
      mean the instance pipe is the ceiling — raise the instance, not the
      volume. AWS Official, updated within three months of retrieval.

  - slug: aws-ebs-general-purpose-ssd
    title: Amazon EBS General Purpose SSD volumes (gp2 and gp3)
    publisher: Amazon Web Services
    url: https://docs.aws.amazon.com/ebs/latest/userguide/general-purpose.html
    version: EBS User Guide, retrieved 2026-07-31
    retrieved_on: '2026-07-31'
    source_type: vendor_doc
    notes: >-
      The gp3 limits, and the sentence that removes an entire failure mode from
      the newer volume type: "gp3 volumes do not use burst performance. They
      can indefinitely sustain their full provisioned IOPS and throughput
      performance."

      That is why BurstBalance does not exist for gp3 and why looking for it is
      not a broken dashboard. gp2's credit bucket is documented here too, and
      is kept because plenty of volumes are still gp2 and the burst-exhaustion
      failure is entirely different from microbursting — it is slow, visible in
      averages, and has a metric.

  - slug: mongodb-performance-tuning-7.0
    title: Performance Tuning — WiredTiger tickets and locking
    publisher: MongoDB, Inc.
    url: https://www.mongodb.com/docs/v7.0/administration/performance-tuning/
    version: MongoDB 7.0 manual
    retrieved_on: '2026-07-31'
    source_type: vendor_doc
    notes: >-
      Describes the reported failure in the vendor's own words: when tickets
      reach zero, "any new read or write requests will be queued until a new
      read or write ticket is available." Queued, not rejected and not slowed —
      which is why the symptom is queries that never return rather than queries
      that take longer.

      Also states the ticket count should always be 128 and that sustained
      values below it indicate a server delay, and that 7.0 replaced the static
      cap with a dynamic algorithm.

  - slug: percona-mongodb-concurrency-algorithm
    title: Customizing the New MongoDB Concurrency Algorithm
    publisher: Percona
    url: https://www.percona.com/blog/customizing-the-new-mongodb-concurrency-algorithm/
    retrieved_on: '2026-07-31'
    source_type: practitioner
    notes: >-
      Carries the bounds of the 7.0 throughputProbing algorithm —
      throughputProbingMinConcurrency defaults to 4 and
      throughputProbingMaxConcurrency to 128 — which the MongoDB manual
      describes qualitatively without publishing the floor.

      The floor is the number that matters here. An algorithm that reacts to
      falling throughput by reducing concurrency can take the ticket pool from
      128 to as few as 4, and 4 tickets against a slow disk is a very small
      number of operations per second. Percona also reports the observable
      consequence directly: restricting concurrency produced a "notable
      increase in the Queued Ops rate".

  - slug: aws-ec2-instance-types-r8i
    title: Amazon EC2 R8i Instances
    publisher: Amazon Web Services
    url: https://aws.amazon.com/ec2/instance-types/r8i
    version: current as of 2026
    retrieved_on: '2026-08-16'
    source_type: vendor_doc
    notes: >-
      Read via an Anthropic deep-research pass, not fetched and archived by a
      human in this session — flagged `practitioner` rather than `documented`
      for that reason (see coefficient notes). Confirmed arithmetically:
      exactly 8 GiB RAM per vCPU across every published r8i size, r8i.large
      (2 vCPU / 16 GiB) through r8i.96xlarge (384 vCPU / 3,072 GiB), including
      bare-metal variants. r8i.96xlarge is the family's memory ceiling —
      beyond it the next option is a different family (X2iedn, U7i), not a
      larger r8i.

