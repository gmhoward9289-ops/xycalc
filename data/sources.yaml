    version: MongoDB 8.3 manual (Current)
    retrieved_on: '2026-08-20'
    source_type: vendor_doc
    notes: >-
      Manual references vs DBRefs. Vendor preference: unless you have a
      compelling reason, use manual references. DBRefs add $ref/$id/optional
      $db fields and still require application (or driver-helper) resolution —
      not automatic. $lookup / $graphLookup are the join stages for normalised
      data; this page does not publish a latency or memory multiplier for them.

