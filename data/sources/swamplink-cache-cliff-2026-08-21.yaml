sources:
- slug: obs-mongodb-cache-cliff-swamplink-2026-08-21
  title: WiredTiger cache oversubscription cliff (A1+A2) on throttled device
  publisher: xycalc benchmark (swamplink)
  retrieved_on: '2026-08-21'
  source_type: benchmark
  notes: >-
    Investigation 006 / issue #9. Harness tools/bench/cache_cliff_probe.sh +
    .py. MongoDB 7.0.39 in Docker on swamplink-eu, direct_io=[data], fresh
    mongod per ratio, concurrency 1, block-IO cgroup 8 MiB/s and 150 IOPS.
    A1: 0.25 GB WT cache, 640 MB container mem, ratios 0.5…50× (two repeats;
    100× failed during load). A2: 1.0 GB WT cache, knee ratios 0.5…2.0.
    failedDeviceGuards=0 on completed legs. Absolute ops/s are throttle
    artifacts; relative shape vs oversubscription is the claim (steepest
    0.8→1.0 on every sweep; transfers to 1 GB). No wt-cache sizing
    coefficient promoted. Write-up:
    docs/investigations/006-cache-cliff/FINDINGS.md. Artifacts:
    docs/investigations/006-cache-cliff/artifacts/.
