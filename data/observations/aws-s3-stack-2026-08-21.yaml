    unit: bytes
    workload: under Celery drive (broker traffic) overlapping CH AWS-S3 scan
    machine_class: AWS m6i.large; redis mem_limit 512m
    system_version: redis:7-alpine
    observed_on: '2026-08-21'
    source: obs-clickhouse-s3-stack-aws-2026-08-21
    notes: docker stats MemUsage, 3.992MiB reported.

  - slug: aws-s3-stack-2026-08-21-celery-idle
    system: celery
    parameter: host.container_rss_bytes
    value: 115553075
    unit: bytes
    workload: idle -- Celery prefork worker up (concurrency 4), no tasks
    machine_class: AWS m6i.large; worker mem_limit 1g; celery[redis]==5.4.0
    system_version: Celery 5.4.0 (celery_probe image)
    observed_on: '2026-08-21'
    source: obs-clickhouse-s3-stack-aws-2026-08-21
    notes: docker stats MemUsage, 110.2MiB reported.

  - slug: aws-s3-stack-2026-08-21-celery-loaded
    system: celery
    parameter: host.container_rss_bytes
    value: 115867648
    unit: bytes
    workload: loaded phase -- worker idle while Mongo/CH hold data
    machine_class: AWS m6i.large; worker mem_limit 1g; celery[redis]==5.4.0
    system_version: Celery 5.4.0 (celery_probe image)
    observed_on: '2026-08-21'
    source: obs-clickhouse-s3-stack-aws-2026-08-21
    notes: docker stats MemUsage, 110.5MiB reported.

  - slug: aws-s3-stack-2026-08-21-celery-under-load
    system: celery
    parameter: host.container_rss_bytes
    value: 124990259
    unit: bytes
    workload: >-
      under Celery drive overlapping ClickHouse AWS-S3 GROUP BY; worker RSS
      sampled during the overlap window
    machine_class: AWS m6i.large; worker mem_limit 1g; celery[redis]==5.4.0
    system_version: Celery 5.4.0 (celery_probe image)
    observed_on: '2026-08-21'
    source: obs-clickhouse-s3-stack-aws-2026-08-21
    notes: docker stats MemUsage, 119.2MiB reported.
