observations:
# T6 / issue #14 — prefetch sweep at 400/s × 30s, concurrency=8.
# Understatement values are end-of-load exact:
#   (enqueued − completedDuringLoad) − queueDepthAtEnd
- slug: swamplink-2026-08-21-prefetch1-understatement
  system: celery
  parameter: queue.outstanding_understatement
  value: 71
  unit: tasks
  workload: >-
    celery_probe prefetch=1 concurrency=8, target 400/s for 30s, acks defaults,
    throttled Mongo behind the fleet
  machine_class: Hetzner CX shared vCPU, 7 GB RAM
  system_version: Celery 5.4.0
  observed_on: '2026-08-21'
  source: obs-celery-prefetch-swamplink-2026-08-21
  notes: >-
    End-of-load understatement. expectedReserved=prefetch×c=8. queueDepthMax=9883,
    throughputPerSecond=63.3, drainTimedOut=true (completedTotal=11862/12000).
    Low-prefetch anomaly vs expected 8 — see FINDINGS.

