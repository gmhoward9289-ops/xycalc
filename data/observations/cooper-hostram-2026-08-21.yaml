- slug: cooper-hostram-2026-08-21-2GiB-cache-vs-cgroup
  system: mongodb
  parameter: cache.size_bytes
  value: 536870912
  unit: bytes
  workload: idle, default cache split, Docker --memory=2GiB
  machine_class: COOPER Docker Desktop, 2GiB cgroup
  system_version: 7.0.39
  observed_on: '2026-08-21'
  source: obs-cooper-hostram-2026-08-21
  notes: >-
    Docker HostConfig.Memory=2147483648. Cache is exactly 0.5 × (2 GiB − 1 GiB)
    = 512 MiB, so mongod's default-split used the cgroup limit. hostInfo
    still reported memSizeMB=3917 — do NOT use this row as a host-ram
    validation actual against hostInfo; it is evidence that cache sizing
    and hostInfo can disagree under Docker Desktop.
