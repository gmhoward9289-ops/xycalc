# Issue #2 Phase 1 — isolated 300s levels. value = ticketsMax (peak);
# notes carry ticketsEnd, ops/s, holdMs, convergence verdict.
- slug: swamplink-2026-08-21-phase1-tickets-c16
  system: mongodb
  parameter: db.concurrency_tickets
  value: 19
  unit: tickets
  workload: >-
    ticket_probe Phase 1, concurrency=16 alone, 300s, throttled device
    (8 MiB/s, 150 IOPS), 1.5M docs
  machine_class: Hetzner CX shared vCPU, 7 GB RAM
  system_version: 7.0.39
  observed_on: '2026-08-21'
  source: obs-mongodb-ticket-probe-phase1-swamplink-2026-08-21
  notes: >-
    ticketsStart=4 ticketsEnd=18 ticketsMax=19. Convergence
    CONVERGED_DEMAND_CAPPED (lateMean=17.07, priorMean=16.94, relDelta=0.0074,
    windowSeconds=90). opsPerSecond=87.0 holdTimeMs=178.62 queueWaitMs=5.2.
    predictedCeilingHold (Nmax/L)=106.4; measured/predicted≈0.82.

