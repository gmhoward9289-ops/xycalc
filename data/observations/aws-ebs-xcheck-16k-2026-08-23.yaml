observations:
  # Guest 1s peak/mean on real gp3 16000/1000. ExceededCheck empty — not a
  # 0/1 case. Under peak is fio rate-limiter startup, not EBS throttle.

  - slug: aws-ebs-xcheck-16k-2026-08-23-under-mean-iops
    system: ebs
    parameter: io.iops
    value: 8082.2
    unit: iops
    workload: >-
      fio randread rate_iops=8000, 4k, QD16, direct=1, 1s IOPS log mean
      over 297 samples
    machine_class: AWS r6i.2xlarge + gp3 100GiB 16000/1000, us-east-2
    system_version: Amazon Elastic Block Store (gp3)
    observed_on: '2026-08-23'
    source: obs-aws-ebs-xcheck-16k-2026-08-23
    notes: >-
      Under-phase mean 8082.2, p50 8001, fio aggregate 7999. First two
      seconds overshot the rate cap (23236, 16775) then held ~8000.
      VolumeIOPSExceededCheck n=0 — not scored.

  - slug: aws-ebs-xcheck-16k-2026-08-23-under-peak-iops
    system: ebs
    parameter: io.iops
    value: 23236
    unit: iops
    workload: >-
      fio randread rate_iops=8000, 4k, QD16, direct=1, 1s IOPS log peak
      second over 297 samples
    machine_class: AWS r6i.2xlarge + gp3 100GiB 16000/1000, us-east-2
    system_version: Amazon Elastic Block Store (gp3)
    observed_on: '2026-08-23'
    source: obs-aws-ebs-xcheck-16k-2026-08-23
    notes: >-
      Startup rate-limiter overshoot (sample 1). Peak after skipping the
      first two samples is 8011. Observed; not a validation actual for
      ebs.iops-to-provision.

  - slug: aws-ebs-xcheck-16k-2026-08-23-under-peak-to-mean
    system: ebs
    parameter: io.peak_to_mean_ratio
    value: 2.875
    unit: ratio
    workload: fio randread rate_iops=8000, peak/mean of 1s IOPS samples
    machine_class: AWS r6i.2xlarge + gp3 100GiB 16000/1000, us-east-2
    system_version: Amazon Elastic Block Store (gp3)
    observed_on: '2026-08-23'
    source: obs-aws-ebs-xcheck-16k-2026-08-23
    notes: peak=23236 / mean=8082.2 over n=297. Ratio is the startup overshoot.

  - slug: aws-ebs-xcheck-16k-2026-08-23-over-mean-iops
    system: ebs
    parameter: io.iops
    value: 16025.74
    unit: iops
    workload: >-
      fio randread uncapped QD64 vs 16000 provisioned, 4k, direct=1,
      1s IOPS log mean over 720 samples
    machine_class: AWS r6i.2xlarge + gp3 100GiB 16000/1000, us-east-2
    system_version: Amazon Elastic Block Store (gp3)
    observed_on: '2026-08-23'
    source: obs-aws-ebs-xcheck-16k-2026-08-23
    notes: >-
      Held at the volume ceiling (mean 16025.74, p50 16004). CW
      VolumeReadOps published. VolumeIOPSExceededCheck empty — not scored.

  - slug: aws-ebs-xcheck-16k-2026-08-23-over-peak-iops
    system: ebs
    parameter: io.iops
    value: 31991
    unit: iops
    workload: >-
      fio randread uncapped QD64 vs 16000 provisioned, 4k, direct=1,
      1s IOPS log peak second over 720 samples
    machine_class: AWS r6i.2xlarge + gp3 100GiB 16000/1000, us-east-2
    system_version: Amazon Elastic Block Store (gp3)
    observed_on: '2026-08-23'
    source: obs-aws-ebs-xcheck-16k-2026-08-23
    notes: >-
      Peak is the first sample; after skipping two seconds the peak is
      16011. Observed, not scored as a provision-this-peak case.

  - slug: aws-ebs-xcheck-16k-2026-08-23-over-peak-to-mean
    system: ebs
    parameter: io.peak_to_mean_ratio
    value: 1.996
    unit: ratio
    workload: fio randread over 16000 provisioned, peak/mean of 1s IOPS samples
    machine_class: AWS r6i.2xlarge + gp3 100GiB 16000/1000, us-east-2
    system_version: Amazon Elastic Block Store (gp3)
    observed_on: '2026-08-23'
    source: obs-aws-ebs-xcheck-16k-2026-08-23
    notes: peak=31991 / mean=16025.74 over n=720. Ratio is the startup second over a capped mean.
