    notes: >-
      dataSize / storageSize = 299,100,000 / 150,441,984. SYNTHETIC generator
      data, not real documents — belongs beside the other synthetic points, not
      the real sample-collection ratios. The generator deliberately avoids
      lorem-ipsum repetition, which is why it lands near 2.0 rather than the 10x+
      a repetitive corpus would show.

