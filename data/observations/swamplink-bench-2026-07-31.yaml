- slug: swamplink-bench-2026-07-31-resident
  parameter: cache.size_bytes
  value: 413259504
  notes: serverStatus().wiredTiger.cache['bytes currently in the cache'] after a full collection
    scan and one scan per index. Cache was 19% full, so this measures the database rather
    than the ceiling. Came in 13.9% above dataSize + indexSize — the cache holds page structures
    and an in-memory index representation on top of the bytes themselves.
  system: mongodb
  unit: bytes
  workload: synthetic events collection, fully scanned then idle
  machine_class: Hetzner CX shared vCPU, 7 GB RAM, 2 GiB WT cache
