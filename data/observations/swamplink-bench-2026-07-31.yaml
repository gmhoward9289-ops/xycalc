- slug: swamplink-bench-2026-07-31-compression-ratio
  parameter: storage.compression_ratio
  value: 1.421
  notes: 'dataSize / storageSize, measured. 1.42x — BELOW the corpus band''s low end of
    1.5. Applies to this data and no other: compressibility is a property of the documents,
    not of the storage engine, and this generator writes random base62 strings that barely
    compress. Read it as a floor on what is possible, not as a typical value.'
  system: mongodb
  unit: ratio
  workload: synthetic events collection, fully scanned then idle
