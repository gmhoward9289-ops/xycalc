    parameter: cache.oversubscription_ratio
    value: 2.02
    unit: ratio
    workload: >-
      1,500,000 docs, dataSize 1086000000 bytes vs 0.5 GB WiredTiger cache
    machine_class: AWS m6i.large, us-east-2
    system_version: mongo:7 (Docker Hub tag)
    observed_on: '2026-08-21'
    source: obs-aws-ch-s3-2026-08-21

