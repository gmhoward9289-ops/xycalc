      AWS m6i.large; clickhouse mem_limit 2g; MergeTree storage_policy=s3_main
      → s3://xycalc-ch-s3-20260821-185845 (us-east-2)
    system_version: clickhouse/clickhouse-server:24.8
    observed_on: '2026-08-21'
    source: obs-aws-ch-s3-2026-08-21
    notes: docker stats MemUsage, 143.7MiB reported. No MinIO service present.

