observations:
  # Arm 4 — s3_stack on AWS with ClickHouse MergeTree parts on real S3
  # (SKIP_MINIO=1). Colocated mongo+redis+celery RSS. host.container_rss_bytes
  # is NOT a mongodb.wt-cache validation quantity.

  - slug: aws-ch-s3-2026-08-21-mongo-idle
    system: mongodb
    parameter: host.container_rss_bytes
    value: 75025613
    unit: bytes
    workload: idle -- stack up, no data loaded; SKIP_MINIO=1 (no MinIO container)
    machine_class: AWS m6i.large, us-east-2; mongo mem_limit 2g, --wiredTigerCacheSizeGB 0.5
    system_version: mongo:7 (Docker Hub tag)
    observed_on: '2026-08-21'
    source: obs-aws-ch-s3-2026-08-21
    notes: docker stats MemUsage, 71.55MiB reported.

  - slug: aws-ch-s3-2026-08-21-mongo-loaded
    system: mongodb
    parameter: host.container_rss_bytes
    value: 543581798
    unit: bytes
    workload: >-
      1,500,000-doc synthetic collection resident (dataSize 1086 MB, 2.02×
      over WiredTiger 0.5 GB cache), no concurrent Celery traffic yet
    machine_class: AWS m6i.large, us-east-2; mongo mem_limit 2g, --wiredTigerCacheSizeGB 0.5
    system_version: mongo:7 (Docker Hub tag)
    observed_on: '2026-08-21'
    source: obs-aws-ch-s3-2026-08-21
    notes: docker stats MemUsage, 518.4MiB reported.

  - slug: aws-ch-s3-2026-08-21-mongo-under-load
    system: mongodb
    parameter: host.container_rss_bytes
    value: 544840090
    unit: bytes
    workload: >-
      same 2.02×-oversub dataset under Celery point-lookup drive
      (PROBE_RATES=50, PROBE_SECONDS=20) overlapping a ClickHouse S3 GROUP BY scan
    machine_class: AWS m6i.large, us-east-2; mongo mem_limit 2g, --wiredTigerCacheSizeGB 0.5
    system_version: mongo:7 (Docker Hub tag)
    observed_on: '2026-08-21'
    source: obs-aws-ch-s3-2026-08-21
    notes: docker stats MemUsage, 519.6MiB reported.

  - slug: aws-ch-s3-2026-08-21-mongo-oversub
