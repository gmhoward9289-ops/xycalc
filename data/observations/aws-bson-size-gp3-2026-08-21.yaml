observations:
  # Arm 3 — same ~2× WiredTiger oversub; document size is the only axis.

  - slug: aws-bson-size-gp3-2026-08-21-1mib-ops
    system: mongodb
    parameter: db.ops_per_second
    value: 748.98
    unit: ops/s
    workload: >-
      random _id point reads, 8 workers, 45s; ~1026 docs avgObjSize≈1.05e6,
      dataSize 1076 MB ≈2.00× 0.5 GB WT cache on gp3
    machine_class: AWS m6i.large + gp3 100GiB 3000/125, us-east-2
    system_version: 'mongo:7'
    observed_on: '2026-08-21'
    source: obs-aws-bson-size-gp3-2026-08-21
    notes: mean_latency_ms=10.673; pages_read_per_op=0.6199.

  - slug: aws-bson-size-gp3-2026-08-21-1mib-latency
