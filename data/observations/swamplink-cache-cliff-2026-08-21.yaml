observations:
# Investigation 006 — cache oversubscription shape on swamplink-eu.
# Absolute ops/s are throttle artifacts. Relative ops vs ratio is the claim.
# A1-r1 + A1-r2: full 0.5…50× at 0.25 GB cache. A2: knee 0.5…2.0 at 1.0 GB.

# -- A1 run 1 ops/s ----------------------------------------------------------
- slug: swamplink-2026-08-21-cliff-a1r1-ops-0p5
  system: mongodb
  parameter: db.ops_per_second
  value: 1590
  unit: ops/s
  workload: >-
    random point lookups, c=1, dataSize/maxCache=0.5×, WT cache 0.25 GB,
    throttled device (8 MiB/s, 150 IOPS), fresh mongod
  machine_class: Hetzner CX shared vCPU, 7.6 GB RAM (swamplink-eu)
  system_version: 7.0.39
  observed_on: '2026-08-21'
  source: obs-mongodb-cache-cliff-swamplink-2026-08-21
  notes: Near-resident baseline for relative-ops normalisation.

