# Celery load against a deliberately I/O-starved MongoDB.
#
#   cd tools/bench/celery_probe && ./run.sh
#
# Everything is scoped to this project: its own network, its own containers,
# its own Redis. The block-IO and memory limits apply to the mongo container's
# cgroup only, so a host serving other things is not affected -- swamplink also
# runs wings, blog and api-demo.
#
# The knobs worth sweeping are all environment variables, because the point of
# the experiment is what Celery's own configuration does to a database under
# stress:
#
#   PROBE_PREFETCH            tasks a worker reserves per slot (default 4)
#   PROBE_ACKS_LATE           0 to ack before execution instead of after
#                              (default 1 -- see tasks.py for why)
#   PROBE_VISIBILITY_TIMEOUT  seconds before the broker redelivers (default 30)
#   PROBE_CONCURRENCY         worker processes (default 8)
#   PROBE_RETRY_POLICY        none|immediate|exponential|jitter (default none)
#   PROBE_RETRY_DEADLINE      wall-clock seconds a task may keep retrying
#                              (default 120)

name: xycalc-celery-probe

services:
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${PROBE_MAXMEMORY:-0}
      - --maxmemory-policy
      - ${PROBE_MAXMEMORY_POLICY:-noeviction}
    mem_limit: 256m

  bookkeeping:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    mem_limit: 256m

  mongo:
    image: mongo:7
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    # Bounds the PAGE CACHE, not just the heap. Without it the host serves
    # reads from its own RAM, the block-IO throttle never engages, and the
    # probe reports a healthy database on a "throttled" disk.
    mem_limit: 640m
    memswap_limit: 640m
    blkio_config:
      device_read_bps:
        - path: /dev/sda
          rate: 8388608
      device_read_iops:
        - path: /dev/sda
          rate: 150

  worker:
    build: .
    command: >-
      celery -A tasks worker
      --loglevel=warning
      --concurrency=${PROBE_CONCURRENCY:-8}
      --without-gossip --without-mingle --without-heartbeat
    environment:
      PROBE_REDIS: redis://redis:6379/0
      PROBE_BOOKKEEPING: redis://bookkeeping:6379/0
      PROBE_MONGO: mongodb://mongo:27017
      PROBE_DOCS: ${PROBE_DOCS:-1500000}
      PROBE_PREFETCH: ${PROBE_PREFETCH:-4}
      PROBE_ACKS_LATE: ${PROBE_ACKS_LATE:-1}
      PROBE_VISIBILITY_TIMEOUT: ${PROBE_VISIBILITY_TIMEOUT:-30}
      PROBE_IGNORE_RESULT: ${PROBE_IGNORE_RESULT:-1}
      PROBE_RESULT_EXPIRES: ${PROBE_RESULT_EXPIRES:-300}
      PROBE_RETRY_POLICY: ${PROBE_RETRY_POLICY:-none}
      PROBE_RETRY_BASE_DELAY: ${PROBE_RETRY_BASE_DELAY:-1}
      PROBE_RETRY_MAX_DELAY: ${PROBE_RETRY_MAX_DELAY:-60}
      PROBE_RETRY_DEADLINE: ${PROBE_RETRY_DEADLINE:-120}
      PROBE_MAX_TIME_MS: ${PROBE_MAX_TIME_MS:-500}
    depends_on: [redis, bookkeeping, mongo]
    mem_limit: 1g

  driver:
    build: .
    command: ["python", "drive.py"]
    environment:
      PROBE_REDIS: redis://redis:6379/0
      PROBE_MONGO: mongodb://mongo:27017
      PROBE_DOCS: ${PROBE_DOCS:-1500000}
      PROBE_RATES: ${PROBE_RATES:-25,50,100,200,400}
      PROBE_SECONDS: ${PROBE_SECONDS:-30}
      PROBE_ACKS_LATE: ${PROBE_ACKS_LATE:-1}
      PROBE_VISIBILITY_TIMEOUT: ${PROBE_VISIBILITY_TIMEOUT:-30}
      PROBE_RETRY_POLICY: ${PROBE_RETRY_POLICY:-none}
      PROBE_RETRY_DEADLINE: ${PROBE_RETRY_DEADLINE:-120}
      PROBE_MAX_TIME_MS: ${PROBE_MAX_TIME_MS:-500}
    depends_on: [redis, mongo, worker]
    profiles: ["driver"]

  stall-driver:
    build: .
    command: ["python", "stall_recover.py"]
    environment:
      PROBE_REDIS: redis://redis:6379/0
      PROBE_MONGO: mongodb://mongo:27017
      PROBE_DOCS: ${PROBE_DOCS:-1500000}
      PROBE_RATES: ${PROBE_RATES:-300}
      PROBE_BASELINE_SECONDS: ${PROBE_BASELINE_SECONDS:-60}
      PROBE_STALL_SECONDS: ${PROBE_STALL_SECONDS:-90}
      PROBE_RECOVERY_TIMEOUT: ${PROBE_RECOVERY_TIMEOUT:-180}
      PROBE_ACKS_LATE: ${PROBE_ACKS_LATE:-1}
      PROBE_VISIBILITY_TIMEOUT: ${PROBE_VISIBILITY_TIMEOUT:-600}
      PROBE_RETRY_POLICY: ${PROBE_RETRY_POLICY:-none}
      PROBE_RETRY_DEADLINE: ${PROBE_RETRY_DEADLINE:-120}
      PROBE_MAX_TIME_MS: ${PROBE_MAX_TIME_MS:-500}
      PROBE_MONGO_CONTAINER: ${PROBE_MONGO_CONTAINER:-}
      PROBE_STALL_MODE: ${PROBE_STALL_MODE:-cgroup}
      PROBE_READ_BPS: ${PROBE_READ_BPS:-8388608}
      PROBE_READ_IOPS: ${PROBE_READ_IOPS:-150}
      PROBE_DEV_MAJOR_MINOR: ${PROBE_DEV_MAJOR_MINOR:-}
    depends_on: [redis, mongo, worker]
    profiles: ["stall"]
    # Needs docker.sock (or host cgroup write) for live throttle rewrite —
    # run_stall_recover.sh mounts it when available.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pid: host
    privileged: true

  evict-driver:
    build: .
    command: ["python", "evict_probe.py"]
    environment:
      PROBE_REDIS: redis://redis:6379/0
      PROBE_BOOKKEEPING: redis://bookkeeping:6379/0
      PROBE_RESULT_BACKEND: redis://bookkeeping:6379/1
      PROBE_MAXMEMORY_POLICY: ${PROBE_MAXMEMORY_POLICY:-noeviction}
      PROBE_PAYLOAD_BYTES: ${PROBE_PAYLOAD_BYTES:-2048}
      PROBE_ENQUEUE_ATTEMPTS: ${PROBE_ENQUEUE_ATTEMPTS:-20000}
      PROBE_DRAIN_TIMEOUT: ${PROBE_DRAIN_TIMEOUT:-120}
      PROBE_CONCURRENCY: ${PROBE_CONCURRENCY:-8}
      PROBE_PREFETCH: ${PROBE_PREFETCH:-4}
      PROBE_ACKS_LATE: ${PROBE_ACKS_LATE:-1}
      PROBE_VISIBILITY_TIMEOUT: ${PROBE_VISIBILITY_TIMEOUT:-30}
      PROBE_IGNORE_RESULT: ${PROBE_IGNORE_RESULT:-1}
      PROBE_RESULT_EXPIRES: ${PROBE_RESULT_EXPIRES:-60}
    depends_on: [redis, bookkeeping]
    profiles: ["evict"]
